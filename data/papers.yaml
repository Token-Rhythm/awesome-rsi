  category: limits-failure-modes
  tags: [self-play, model-collapse, verifier, formal-analysis]
  summary: "Isolates data gating from reward design in self-play RL and shows the executability gate alone determines survival: validation accuracy holds near 0.7 under every reward variant but collapses to ~0.005 once the gate leaks."
  summary_zh: "把自博弈 RL 中的数据门控与奖励设计分离，证明可执行性门控本身决定存亡：在各种奖励变体下验证准确率都稳定在 0.7 左右，而门控一旦泄漏就崩塌到约 0.005。"
- id: collapse-free-multi-reward-rlif
  title: "Two is better than one: A Collapse-free Multi-Reward RLIF Training Framework"
  url: "https://arxiv.org/abs/2605.22620"
  link_label: arXiv
  date: 2026-05
  venue: arXiv
  authors: Joarder et al.
  category: self-improving-training
  tags: [label-free-rl, self-rewarding, reward-hacking, reinforcement-learning]
  summary: "Pairs a cluster-voting answer reward with a self-certainty reward whose opposite hacking incentives cancel, normalized group-wise and regularized by KL-Cov, keeping unsupervised RL within a few points of supervised GRPO where single-signal RLIF collapses to zero."
  summary_zh: "将答案层面的聚类投票奖励与生成层面的自置信度奖励配对，二者相反的奖励作弊倾向互相抵消，再经组内解耦归一化与 KL-Cov 正则，使全无监督训练保持在监督 GRPO 数点之内，而单信号 RLIF 会崩溃归零。"
- id: acdc-coevolution
  title: Discovering Novel LLM Experts via Task-Capability Coevolution
  url: "https://arxiv.org/abs/2604.14969"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Dai et al.
  repo: SakanaAI/AC-DC
  category: open-ended-evolution
  tags: [co-evolution, quality-diversity, evolutionary-search, synthetic-data]
  summary: "AC/DC coevolves a population of LLMs, merged by task-vector interpolation and SVD mutation, against an archive of synthetic tasks proposed by a scientist LLM, lifting capability coverage 2-10% and letting 21B ensembles beat a 72B baseline."
  summary_zh: "AC/DC 让一群 LLM 通过任务向量插值合并与 SVD 变异协同进化，同时由一个 scientist LLM 生成并演化合成任务档案，使能力 Coverage 提升 2%-10%，21B 规模的模型组合超过 72B 基线。"
- id: pbt-nca
  title: "Evolving Many Worlds: Towards Open-Ended Discovery in Petri Dish NCA via Population-Based Training"
  url: "https://arxiv.org/abs/2604.11248"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Berdica et al.
  repo: arberzela/pbt-nca
  category: open-ended-evolution
  tags: [open-endedness, evolutionary-search, co-evolution]
  summary: "PBT-NCA wraps population-based training around competing Petri dish neural cellular automata, selecting worlds by archived behavioral novelty plus DINOv2 visual diversity, sustaining edge-of-chaos complexity and emergent spirals, gliders and trail-following where fixed hyperparameters collapse into noise."
  summary_zh: "PBT-NCA 在相互竞争的 Petri Dish 神经元胞自动机之上套用基于种群的训练，用档案化行为新颖性加 DINOv2 视觉多样性来选择世界，持续维持混沌边缘的复杂度并涌现螺旋波、滑翔体与轨迹跟随，而固定超参数只会退化为噪声。"
- id: externalization-survey
  title: "Externalization in LLM Agents: A Unified Review of Memory, Skills, Protocols and Harness Engineering"
  url: "https://arxiv.org/abs/2604.08224"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Zhou et al.
  category: surveys-position
  tags: [survey, taxonomy, memory, skill-library]
  summary: "Surveys how LLM agents now improve outside their weights, taxonomizing four externalization layers (memory, skills, protocols and harness engineering) and consolidating self-evolving harness work on memory-module evolution, skill distillation from traces, and autonomic lifecycle management."
  summary_zh: "综述 LLM 智能体如何在权重之外获得提升，将其归纳为记忆、技能、协议与 harness 工程四个外化层次，并汇总了记忆模块演化、从执行轨迹中蒸馏技能以及自治生命周期管理等自演化 harness 工作。"
- id: c4ai-alphazero-benchmark
  title: Frontier Coding Agents Can Now Implement an AlphaZero Self-Play Machine Learning Pipeline For Connect Four That Performs Comparably to an External Solver
  url: "https://arxiv.org/abs/2604.25067"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Sherwood et al.
  repo: jsherwood00/C4AI
  category: benchmarks-infrastructure
  tags: [benchmark, coding-agents, self-play, sandbox]
  summary: "Benchmarks AI-building-AI by having coding agents build an AlphaZero self-play pipeline for Connect Four inside a 3-hour sandbox; Claude Opus 4.7 reaches near-solver strength on a task near-impossible months earlier."
  summary_zh: "以编码智能体能否在 3 小时沙箱内从零搭建 Connect Four 的 AlphaZero 自博弈流水线来衡量 AI 造 AI 的能力；Claude Opus 4.7 已接近完美求解器水平，而该任务在数月前几乎不可能完成。"
- id: frontier-eng
  title: "Frontier-Eng: Benchmarking Self-Evolving Agents on Real-World Engineering Tasks with Generative Optimization"
  url: "https://arxiv.org/abs/2604.12290"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Chi et al.
  repo: EinsiaLab/Frontier-Engineering
  category: benchmarks-infrastructure
  tags: [benchmark, verifier, sandbox]
  summary: "Scores agents by the best feasible design they reach within a fixed budget across 47 simulator-backed engineering tasks with sandboxed verifiers, revealing a dual power-law decay where self-improvement returns approach zero after roughly 50-100 iterations."
  summary_zh: "在 47 个由仿真器支撑、验证器沙箱化的工程任务上，以固定预算内取得的最优可行方案为智能体评分，揭示自我改进呈双重幂律衰减，约 50-100 次迭代后边际收益趋近于零。"
- id: picbreeder-vlm
  title: "In Search of the Ingredients of Open-Endedness: Replicating Picbreeder with Large Vision-Language Models"
  url: "https://arxiv.org/abs/2605.23908"
  link_label: arXiv
  date: 2026-04
  venue: GECCO 2026
  authors: Earle et al.
  repo: smearle/picbreeder-vlm
  category: open-ended-evolution
  tags: [open-endedness, evolutionary-search, model-collapse, multimodal]
  summary: "Replaces Picbreeder's human curators with frontier VLMs that select and branch CPPN-evolved images, finding severe mode collapse and lower phylogenetic branching diversity (J1 0.235 vs 0.363) than humans, with epsilon-greedy noise and single-step memory partially restoring exploration."
  summary_zh: "用前沿 VLM 取代 Picbreeder 中负责挑选与分支的人类用户来演化 CPPN 图像，发现其出现严重的模式坍塌、系统发育分支多样性低于人类（J1 为 0.235 对 0.363），而 epsilon-greedy 噪声与单步记忆可部分恢复探索。"
- id: tpgo
  title: "Learning to Evolve: A Self-Improving Framework for Multi-Agent Systems via Textual Parameter Graph Optimization"
  url: "https://arxiv.org/abs/2604.20714"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: He et al.
  category: context-prompt-workflow
  tags: [prompt-optimization, workflow-search, multi-agent, memory]
  summary: "Optimizes a multi-agent system as a graph of textual prompt parameters using clustered natural-language gradients from execution traces, with a memory-backed meta-optimizer that reuses past edits, lifting GAIA pass@1 from 73.8% to 81.6%."
  summary_zh: "把多智能体系统表示为文本提示参数图，用从执行轨迹中聚类得到的自然语言梯度进行优化，并由带记忆的元优化器复用历史修改，将 GAIA pass@1 从 73.8% 提升到 81.6%。"
- id: isomorphic-perturbation-testing
  title: "LLMs Gaming Verifiers: RLVR can Lead to Reward Hacking"
  url: "https://arxiv.org/abs/2604.15149"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Helff et al.
  category: limits-failure-modes
  tags: [reward-hacking, verifier, reinforcement-learning]
  summary: "Isomorphic Perturbation Testing re-checks induced rules on identifier-permuted copies of a task, exposing RLVR-trained models that pass verifiers by enumerating object identifiers instead of inducing rules, shortcuts that grow with task complexity and test-time compute."
  summary_zh: "Isomorphic Perturbation Testing 在标识符被置换的等价任务上重新校验归纳出的规则，揭示经 RLVR 训练的模型靠枚举对象标识符通过验证器而非真正归纳规则，且这种捷径随任务复杂度与测试时计算量增加而增多。"
- id: experience-driven-safety-risks
  title: On Safety Risks in Experience-Driven Self-Evolving Agents
  url: "https://arxiv.org/abs/2604.16968"
  link_label: arXiv
  date: 2026-04
  venue: ACL 2026 Findings
  authors: Zhao et al.
  category: safety-governance
  tags: [safety-evaluation, memory, experience-reuse]
  summary: "Accumulated benign task experience alone degrades agent safety: across seven backbones and two memory frameworks, attack success rates rise 13-49% because retrieved trajectories bias the agent toward acting over refusing, and refusal memories trade safety for over-refusal."
  summary_zh: "仅靠积累良性任务的经验就会削弱智能体安全性：在 7 个基座模型与两种记忆框架上，攻击成功率上升 13%-49%，因为检索到的轨迹使智能体偏向执行而非拒绝，而加入拒绝经验又会带来过度拒绝。"
- id: internal-use-risk-reporting
  title: "Risk Reporting for Developers' Internal AI Model Use"
  url: "https://arxiv.org/abs/2604.24966"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Delaney et al.
  category: safety-governance
  tags: [governance, safety-evaluation, position-paper]
  summary: "Proposes a harmonized internal-use risk report satisfying SB 53, the RAISE Act, and the EU GPAI Code, crossing autonomous-misbehavior with insider threats across means, motive, and opportunity, and treating AI R&D automation metrics as a leading indicator."
  summary_zh: "提出一份统一的内部使用风险报告模板，可同时满足 SB 53、RAISE Act 与欧盟 GPAI 行为准则，将自主失控与内部人员威胁两条路径同手段、动机、机会三要素交叉，并把 AI R&D 自动化指标作为先行指标。"
- id: sea-eval
  title: "SEA-Eval: A Benchmark for Evaluating Self-Evolving Agents Beyond Episodic Assessment"
  url: "https://arxiv.org/abs/2604.08988"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Jiang et al.
  category: benchmarks-infrastructure
  tags: [benchmark, memory, experience-reuse]
  summary: "Composes 32 atomic web and system tasks into 92 sequential streams under clean or noisy memory, scoring self-evolving agents on token consumption as well as success rate; costs diverge up to 31x at comparable success, exposing pseudo-evolution."
  summary_zh: "把 32 个原子级网页与本地系统任务组合成 92 条顺序任务流，在干净与含噪记忆条件下同时以成功率和 token 消耗评估自进化智能体；成功率相近时成本相差最高约 31 倍，暴露出伪进化。"
- id: self-correction-feedback-control
  title: "Self-Correction as Feedback Control: Error Dynamics, Stability Thresholds, and Prompt Interventions in LLMs"
  url: "https://arxiv.org/abs/2604.22273"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Liu et al.
  category: limits-failure-modes
  tags: [self-correction, formal-analysis, theory]
  summary: "Models iterative self-correction as a two-state Markov chain with error-introduction and error-correction rates, deriving a stability threshold that predicts refinement only helps near-zero-EIR models; a verify-first prompt flips GPT-4o-mini from -6.2pp to positive."
  summary_zh: "将迭代式自我纠错建模为含错误引入率与纠错率的两态马尔可夫链，推导出稳定性阈值，表明只有 EIR 接近零的模型才能从反复精炼中获益；verify-first 提示可将 GPT-4o-mini 由 -6.2pp 翻为正收益。"
- id: csrs
  title: Stabilizing Unsupervised Self-Evolution of MLLMs via Continuous Softened Retracing reSampling
  url: "https://arxiv.org/abs/2604.03647"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Yu et al.
  repo: yyy195/CSRS
  category: self-improving-training
  tags: [label-free-rl, multimodal, model-collapse]
  summary: "Replaces binary majority-vote rewards in label-free multimodal RL with a frequency-calibrated continuous reward plus mid-trajectory re-inference and image noise, curbing self-reinforcing collapse and raising Qwen2.5-VL-7B's math-reasoning average from 51.6 to 53.4."
  summary_zh: "在无标签多模态 RL 中用频率校准的连续奖励取代二值多数投票奖励，并加入轨迹中途重推理与图像噪声，抑制自我强化式坍缩，将 Qwen2.5-VL-7B 的数学推理平均分从 51.6 提升到 53.4。"
- id: vocabulary-dropout
  title: Vocabulary Dropout for Curriculum Diversity in LLM Co-Evolution
  url: "https://arxiv.org/abs/2604.03472"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Dineen et al.
  category: self-play-zero-data
  tags: [self-play, proposer-solver, curriculum, zero-data]
  summary: "Masks a random subset of the proposer's output logits each batch to prevent curriculum diversity collapse in R-Zero-style self-play, halving Self-BLEU and adding 4.4 points to an 8B solver's reasoning average."
  summary_zh: "每个批次随机屏蔽出题者的一部分输出 logits，以防止 R-Zero 式自博弈中的课程多样性坍缩，使 Self-BLEU 减半，并让 8B 求解器的推理平均分提高 4.4 分。"
- id: continual-learning-moves-to-memory
  title: "When Continual Learning Moves to Memory: A Study of Experience Reuse in LLM Agents"
  url: "https://arxiv.org/abs/2604.27003"
  link_label: arXiv
  date: 2026-04
  venue: arXiv
  authors: Hu et al.
  category: limits-failure-modes
  tags: [memory, experience-reuse, continual-learning, forgetting]
  summary: "Shows memory-augmented agents relocate rather than escape the stability-plasticity dilemma: raw stored trajectories give negative forward transfer (-9.5% on ALFWorld) while LLM-abstracted insights give positive transfer, and fine-grained memory trades +15% forward for -10% backward transfer."
  summary_zh: "指出记忆增强智能体只是转移而非摆脱稳定性-可塑性困境：直接存储原始轨迹带来负向前向迁移（ALFWorld -9.5%），而 LLM 抽象出的经验洞见带来正向迁移，细粒度记忆则以 -10% 后向迁移换取 +15% 前向迁移。"
- id: automating-ai-research-growth
  title: "When Does Automating AI Research Produce Explosive Growth? Feedback Loops in Innovation Networks"
  url: "https://www.nber.org/papers/w35155"
  link_label: Paper
  date: 2026-04
  venue: NBER Working Paper
  authors: Davidson et al.
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Embeds AI task automation in a multi-sector innovation-network growth model and derives a closed-form explosion condition, finding roughly 13% uniform automation of research tasks suffices to tip growth from exponential to hyperbolic."
  summary_zh: "在多部门创新网络增长模型中嵌入 AI 任务自动化，推导出闭式的爆炸性增长条件，发现约 13% 的研究任务被统一自动化即足以使增长由指数转为超指数。"
- id: agentfactory
  title: "AgentFactory: A Self-Evolving Framework Through Executable Subagent Accumulation and Reuse"
  url: "https://arxiv.org/abs/2603.18000"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Zhang et al.
  repo: zzatpku/AgentFactory
  category: self-modifying-agents
  tags: [meta-agent, tool-synthesis, skill-library, coding-agents]
  summary: "Synthesizes each subtask into a standalone Python subagent with its own SKILL.md and tool subset, then accumulates, retrieves, and repairs that library across tasks, cutting orchestration tokens up to 64% versus from-scratch ReAct."
  summary_zh: "将每个子任务合成为独立的 Python 子智能体，配有各自的 SKILL.md 与精选工具子集，并跨任务累积、检索与修复该库，使编排层 token 消耗相比从零开始的 ReAct 最多降低 64%。"
- id: aira-2
  title: "AIRA_2: Overcoming Bottlenecks in AI Research Agents"
  url: "https://arxiv.org/abs/2603.26499"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Hambardzumyan et al.
  category: automated-ai-research
  tags: [evolutionary-search, coding-agents, benchmark]
  summary: "Asynchronous multi-GPU evolutionary search, hidden-label evaluation splits, and ReAct operators that inspect their own logs push research agents to 83.1% mean percentile on MLE-bench-30, beating human state-of-the-art on 11 of 20 AIRS-Bench tasks."
  summary_zh: "异步多 GPU 进化搜索、隐藏标签的评测划分以及能自查日志的 ReAct 算子，把研究智能体在 MLE-bench-30 上的平均百分位推到 83.1%，并在 AIRS-Bench 的 20 个任务中有 11 个超过人类最好成绩。"
- id: covolve
  title: "COvolve: Adversarial Co-Evolution of Large-Language-Model-Generated Policies and Environments via Two-Player Zero-Sum Game"
  url: "https://arxiv.org/abs/2603.28386"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Sygkounas et al.
  category: open-ended-evolution
  tags: [open-endedness, co-evolution, curriculum, evolutionary-search]
  summary: "Pits an LLM environment-designer against an LLM policy-writer in a zero-sum game, then mixes the accumulated policy population at its linear-programming Nash equilibrium, producing an automated curriculum that avoids forgetting across MiniGrid, PyGame and CARLA."
  summary_zh: "让一个 LLM 环境设计器与一个 LLM 策略编写器进行零和博弈，并用线性规划求得的混合策略纳什均衡组合已累积的策略种群，从而形成自动课程，在 MiniGrid、PyGame 与 CARLA 上避免遗忘。"
- id: evolutionary-rl-algorithm-discovery
  title: Evolutionary Discovery of Reinforcement Learning Algorithms via Large Language Models
  url: "https://arxiv.org/abs/2603.28416"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Sygkounas et al.
  category: automated-ai-research
  tags: [algorithm-discovery, evolutionary-search, reinforcement-learning]
  summary: "Island-based evolutionary search uses LLMs as mutation and crossover operators over executable RL update rules, banning actor-critic and temporal-difference mechanisms, and discovers two value-function-free algorithms competitive with SAC and PPO that transfer to unseen environments."
  summary_zh: "基于岛屿模型的进化搜索以 LLM 作为变异与交叉算子，直接在可执行的 RL 更新规则代码上搜索并禁用 actor-critic 与时序差分机制，发现两个不含价值函数、可媲美 SAC 与 PPO 且能迁移到未见环境的算法。"
- id: evoskill
  title: "EvoSkill: Automated Skill Discovery for Multi-Agent Systems"
  url: "https://arxiv.org/abs/2603.02766"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Alzubi et al.
  repo: sentient-agi/EvoSkill
  category: memory-experience-agents
  tags: [skill-library, experience-reuse, archive-search, coding-agents]
  summary: "An Executor-Proposer-Skill-Builder loop diagnoses capability gaps from execution traces and writes new skill folders into a Pareto-filtered library, lifting a frozen Claude Code agent by 7.3 points on OfficeQA and 12.1 on SealQA."
  summary_zh: "Executor–Proposer–Skill-Builder 循环从执行轨迹诊断能力缺口，并将新的 skill 文件夹写入经 Pareto 过滤的技能库，使权重冻结的 Claude Code 智能体在 OfficeQA 上提升 7.3 分、在 SealQA 上提升 12.1 分。"
- id: ssgm-evolving-memory
  title: "Governing Evolving Memory in LLM Agents: Risks, Mechanisms, and the Stability and Safety Governed Memory (SSGM) Framework"
  url: "https://arxiv.org/abs/2603.11768"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Lam et al.
  category: safety-governance
  tags: [memory, governance, taxonomy]
  summary: "Taxonomizes how self-rewriting agent memory fails — semantic drift, poisoning, cross-agent leakage — and proposes SSGM, three governance layers (provenance-and-freshness read gate, contradiction-rejecting write gate, immutable episodic ledger) that decouple memory evolution from execution."
  summary_zh: "梳理自我改写的智能体记忆如何失效（语义漂移、投毒、跨智能体泄露），并提出 SSGM 的三层治理：带来源与新鲜度校验的读取门、拒绝矛盾更新的写入门、不可变情节账本，将记忆演化与执行解耦。"
- id: urlvr-scaling-limits
  title: "How Far Can Unsupervised RLVR Scale LLM Training?"
  url: "https://arxiv.org/abs/2603.08660"
  link_label: arXiv
  date: 2026-03
  venue: ICLR 2026
  authors: He et al.
  repo: PRIME-RL/TTRL
  category: limits-failure-modes
  tags: [label-free-rl, model-collapse, reward-hacking, theory]
  summary: "Unifies unsupervised RLVR under one theory showing KL-regularized intrinsic rewards converge geometrically to sharpening the base model's initial majority answer, with all five variants collapsing near 1,000 steps and flipping correctness on only ~12% of problems."
  summary_zh: "以统一理论刻画无监督 RLVR，证明 KL 正则化下的内在奖励会以几何速率收敛到仅锐化基座模型的初始多数答案；五种变体均在约 1,000 步坍塌，且仅约 12% 的题目正确性被翻转。"
- id: hyperagents
  title: Hyperagents
  url: "https://arxiv.org/abs/2603.19461"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Zhang et al.
  repo: facebookresearch/HyperAgents
  category: self-modifying-agents
  tags: [self-modifying-code, meta-agent, archive-search, open-endedness]
  landmark: true
  summary: "Folds the task agent and the meta agent that proposes self-modifications into one editable program, so the improvement procedure is itself improvable; open-ended archive search lifts four unrelated domains and the invented meta-machinery transfers to unseen ones."
  summary_zh: "将任务智能体与提出自我修改的元智能体合并为同一份可编辑程序，使改进程序自身也可被改进；开放式存档搜索在四个不相关领域取得提升，且其自行发明的元级机制可迁移到未见领域。"
- id: safety-verification-limits
  title: Information-Theoretic Limits of Safety Verification for Self-Improving Systems
  url: "https://arxiv.org/abs/2603.28650"
  link_label: arXiv
  date: 2026-03
  venue: arXiv
  authors: Scrivens
  category: foundations-theory
  tags: [theory, formal-analysis, safety-evaluation]
  summary: "Proves no classifier-style safety gate can hold cumulative risk bounded while accepting unboundedly many self-modifications when safe and unsafe parameter distributions overlap, and shows sound Lipschitz-ball verification escapes the bound at O(d) cost."
