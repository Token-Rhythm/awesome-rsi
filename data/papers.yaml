  category: safety-governance
  tags: [governance, position-paper, safety-evaluation]
  summary: "Comparing the EU AI Act, SB 53, RAISE and AIREA, this analysis shows frontier rules target external releases while R&D-automating systems deploy only inside labs, exposing scope ambiguity, point-in-time compliance, and information asymmetry."
  summary_zh: "通过比较欧盟 AI Act、SB 53、RAISE 与 AIREA，该分析指出前沿监管只针对对外发布，而自动化研发的系统仅在实验室内部部署，暴露出范围模糊、时点式合规与信息不对称三类结构性缺口。"
- id: faithful-self-evolvers
  title: Large Language Model Agents Are Not Always Faithful Self-Evolvers
  url: "https://arxiv.org/abs/2601.22436"
  link_label: arXiv
  date: 2026-01
  venue: ICML 2026
  authors: Zhao et al.
  repo: Dreamcatcher0622/Faithfulness
  category: limits-failure-modes
  tags: [memory, experience-reuse, faithfulness]
  summary: "Causally tests whether self-evolving agents actually use their memories by emptying, corrupting, or replacing them, finding agents depend on raw trajectories but score nearly identically under corrupted, irrelevant, or filler condensed experience."
  summary_zh: "以清空、破坏或替换记忆的方式因果检验自演化智能体是否真的使用经验，发现它们依赖原始轨迹，但在被破坏、无关或填充式的浓缩经验下得分几乎相同。"
- id: meta-context-engineering
  title: Meta Context Engineering via Agentic Skill Evolution
  url: "https://arxiv.org/abs/2601.21557"
  link_label: arXiv
  date: 2026-01
  venue: arXiv
  authors: Ye et al.
  repo: metaevo-ai/meta-context-engineering
  category: context-prompt-workflow
  tags: [context-engineering, skill-library, evolutionary-search, meta-agent]
  summary: "MCE evolves the context-engineering procedure itself — reusable skill folders of methodologies, scripts and templates — through agentic crossover under a (1+1)-ES, gaining 16.9% mean relative improvement over ACE-style baselines with 4.8x fewer rollouts."
  summary_zh: "MCE 通过 agentic crossover 在 (1+1)-ES 下进化上下文工程流程本身——即包含方法论、脚本与模板的可复用技能文件夹——相对 ACE 类基线平均提升 16.9%，且 rollout 数量减少 4.8 倍。"
- id: monoscale
  title: "MonoScale: Scaling Multi-Agent System with Monotonic Improvement"
  url: "https://arxiv.org/abs/2601.23219"
  link_label: arXiv
  date: 2026-01
  venue: arXiv
  authors: Shao et al.
  category: multi-agent-evolution
  tags: [multi-agent, agent-topology, memory, formal-analysis]
  summary: "MonoScale onboards each new agent by distilling synthesized familiarization rollouts into auditable routing principles under a trust-region bandit update with conservative fallback, guaranteeing non-decreasing performance and lifting GAIA from 44.8% to 55.2% at ten agents."
  summary_zh: "MonoScale 为每个新接入的智能体合成熟悉化任务并将其 rollout 蒸馏成可审计的路由准则，在带保守回退的信赖域老虎机更新下保证性能不下降，并在十智能体规模上将 GAIA 从 44.8% 提升到 55.2%。"
- id: limits-self-improving-llms
  title: "On the Limits of Self-Improving in Large Language Models: The Singularity Is Not Near Without Symbolic Model Synthesis"
  url: "https://arxiv.org/abs/2601.05280"
  link_label: arXiv
  date: 2026-01
  venue: arXiv
  authors: Zenil
  category: limits-failure-modes
  tags: [model-collapse, theory, formal-analysis, takeoff]
  summary: "Models recursive self-training as KL density matching on a shrinking share of grounded data and proves entropy decay plus unbounded variance drift once external signal vanishes, arguing symbolic program synthesis, not scale, escapes collapse."
  summary_zh: "将递归自训练形式化为在外部真实数据占比不断下降时的 KL 密度匹配，证明外部信号消失后会出现熵衰减与无界方差漂移，主张靠符号化程序合成而非扩大规模才能摆脱崩塌。"
- id: search-self-edit-strategies
  title: Search over Self-Edit Strategies for LLM Adaptation
  url: "https://arxiv.org/abs/2601.14532"
  link_label: arXiv
  date: 2026-01
  venue: arXiv
  authors: Cheong et al.
  repo: cheongalc/search-self-edit-strategies
  category: self-improving-training
  tags: [weight-editing, synthetic-data, archive-search, model-collapse]
  summary: "Searches over SEAL-style self-edits by proposing paired data-creation instructions and finetuning hyperparameters, scoring each by post-update QA accuracy in a ReSTEM loop, yet archives accelerate mode collapse and still trail hand-designed templates."
  summary_zh: "通过提出「数据生成指令 + 微调超参」组合来搜索 SEAL 式 self-edit，用更新后的问答准确率在 ReSTEM 循环中打分，但归档反而加速模式崩塌，效果仍不及人工设计的模板。"
- id: soar
  title: "Teaching Models to Teach Themselves: Reasoning at the Edge of Learnability"
  url: "https://arxiv.org/abs/2601.18778"
  link_label: arXiv
  date: 2026-01
  venue: ICML 2026
  authors: Sundaram et al.
  category: self-play-zero-data
  tags: [self-play, proposer-solver, curriculum, reinforcement-learning]
  summary: "SOAR trains a teacher to propose synthetic problems rewarded by the student's measured learning progress on held-out hard tasks, lifting pass@32 by 8.5% on MATH problems the base model never solves."
  summary_zh: "SOAR 训练一个教师模型提出合成题目，其奖励来自学生在留出难题上实测的学习进步，使基座模型从未解出的 MATH 题目的 pass@32 提升 8.5%。"
- id: why-self-rewarding-works
  title: "Why Self-Rewarding Works: Theoretical Guarantees for Iterative Alignment of Language Models"
  url: "https://arxiv.org/abs/2601.22513"
  link_label: arXiv
  date: 2026-01
  venue: arXiv
  authors: Fu et al.
  category: foundations-theory
  tags: [self-rewarding, theory, formal-analysis]
  summary: "Proves finite-sample guarantees for self-rewarding alignment, showing a single DPO round is unreliable while iteration contracts a policy condition number so error decays to an initialization-independent O(1/sqrt(n)) floor exponentially in rounds."
  summary_zh: "为自奖励对齐给出有限样本保证：单轮 DPO 自对齐本质上不可靠，而迭代会收缩策略条件数，使误差以随轮数指数衰减的方式降至与初始化无关的 O(1/sqrt(n)) 下界。"
- id: adaptation-agentic-ai-survey
  title: "Adaptation of Agentic AI: A Survey of Post-Training, Memory, and Skills"
  url: "https://arxiv.org/abs/2512.16301"
  link_label: arXiv
  date: 2025-12
  venue: arXiv
  authors: Jiang et al.
  category: surveys-position
  tags: [survey, taxonomy, memory, continual-learning]
  summary: "Surveys agent adaptation after pretraining with a four-paradigm agent/tool taxonomy (agent trained from tool-execution signal or from its own output evaluations; tools trained agent-agnostically or supervised by a frozen agent), covering post-training, adaptive memory, and skills."
  summary_zh: "该综述以四范式的智能体/工具分类法（从工具执行信号或自身输出评估训练智能体；与智能体无关地训练工具或由冻结智能体监督训练工具）梳理预训练之后的适应方法，涵盖后训练、自适应记忆与技能。"
- id: evolattice
  title: "EvoLattice: Persistent Internal-Population Evolution through Multi-Alternative Quality-Diversity Graph Representations for LLM-Guided Program Discovery"
  url: "https://arxiv.org/abs/2512.13857"
  link_label: arXiv
  date: 2025-12
  venue: arXiv
  authors: Yuksel
  category: open-ended-evolution
  tags: [evolutionary-search, quality-diversity, archive-search, algorithm-discovery]
  summary: "EvoLattice stores the population as one DAG whose nodes hold multiple persistent alternatives, making every path a candidate program and per-alternative statistics dense credit signal for the LLM, beating FunSearch- and AlphaEvolve-style baselines on architecture ranking."
  summary_zh: "EvoLattice 用一张 DAG 承载整个种群，每个节点保存多个持久备选方案，使每条路径都成为一个候选程序，并把逐备选方案的统计量作为稠密信用信号反馈给 LLM，在架构排序任务上超过 FunSearch、AlphaEvolve 风格基线。"
- id: memory-age-ai-agents
  title: Memory in the Age of AI Agents
  url: "https://arxiv.org/abs/2512.13564"
  link_label: arXiv
  date: 2025-12
  venue: arXiv
  authors: Hu et al.
  category: surveys-position
  tags: [survey, memory, experience-reuse, taxonomy]
  summary: "Frames agent memory as an external, continuously evolving cognitive state distinct from KV-cache internals, RAG, and context engineering, and organizes it by forms, functions (factual, experiential, working), and dynamics of formation, evolution, and retrieval."
  summary_zh: "该综述把智能体记忆界定为区别于 KV-cache 内部机制、RAG 与上下文工程的外部且持续演化的认知状态，并按形态、功能（事实、经验、工作记忆）以及形成、演化与检索的动态过程加以组织。"
- id: mortar
  title: "Mortar: Evolving Mechanics for Automatic Game Design"
  url: "https://arxiv.org/abs/2601.00105"
  link_label: arXiv
  date: 2025-12
  venue: arXiv
  authors: Nasir et al.
  category: open-ended-evolution
  tags: [evolutionary-search, quality-diversity, open-endedness]
  summary: "Mortar evolves individual game mechanics in a MAP-Elites archive with an LLM as variation operator, scoring each by whether MCTS-composed games rank a skill ladder correctly, raising QD score to 31.18 versus 17.64 for LLM-only selection."
  summary_zh: "Mortar 以 LLM 作为变异算子在 MAP-Elites 存档中演化单个游戏机制，用 MCTS 组合出的游戏能否正确区分技能梯队来打分，将 QD 得分从仅用 LLM 选择的 17.64 提升到 31.18。"
- id: nested-learning
  title: "Nested Learning: The Illusion of Deep Learning Architectures"
  url: "https://arxiv.org/abs/2512.24695"
  link_label: arXiv
  date: 2025-12
  venue: NeurIPS 2025
  authors: Behrouz et al.
  category: foundations-theory
  tags: [theory, self-referential, continual-learning, memory]
  landmark: true
  summary: "Recasts a model and its optimizer as nested optimization problems updating at different frequencies, yielding self-modifying Titans and a continuum memory system whose combination, HOPE, beats Transformer++ and Mamba2 on language and continual learning."
  summary_zh: "把模型与其优化器重构为按不同更新频率嵌套的一组优化问题，由此得到能学习自身更新规则的 Self-Modifying Titans 与连续记忆系统，二者结合的 HOPE 在语言建模与持续学习上超过 Transformer++ 与 Mamba2。"
- id: psv-propose-solve-verify
  title: "Propose, Solve, Verify: Self-Play Through Formal Verification"
  url: "https://arxiv.org/abs/2512.18160"
  link_label: arXiv
  date: 2025-12
  venue: arXiv
  authors: Wilf et al.
  repo: abwilf/psv
  category: self-play-zero-data
  tags: [self-play, proposer-solver, verifier, zero-data]
  summary: "PSV runs a proposer/solver self-play loop where a formal verifier (Verus over Rust) supplies unhackable reward and pass-rate-bucketed difficulty tiers drive the curriculum, lifting pass@1 up to 9.6x over baselines with no human data."
  summary_zh: "PSV 采用提议者/求解者自博弈循环，由形式化验证器（Rust 上的 Verus）提供难以被钻空子的奖励，并按求解通过率分档形成难度课程，在无人类数据下将 pass@1 最高提升 9.6 倍。"
- id: recontextualization
  title: Recontextualization Mitigates Specification Gaming without Modifying the Specification
  url: "https://arxiv.org/abs/2512.19027"
  link_label: arXiv
  date: 2025-12
  venue: arXiv
  authors: Azarbal et al.
  repo: arianaazarbal/recontextualization
  category: safety-governance
  tags: [reward-hacking, reinforcement-learning, safety-evaluation]
  summary: "Decouples the data-generation prompt from the training prompt during on-policy RL, so completions sampled under misbehavior-discouraging prompts are updated against permissive ones, cutting specification gaming across four settings while preserving capability."
  summary_zh: "在 on-policy RL 中把数据生成提示与训练提示解耦：在抑制不当行为的提示下采样补全，再配上放任的提示做梯度更新，从而在四个场景中减少 specification gaming 且不损失能力。"
- id: self-play-swe-rl
  title: Toward Training Superintelligent Software Agents through Self-Play SWE-RL
  url: "https://arxiv.org/abs/2512.18552"
  link_label: arXiv
  date: 2025-12
  venue: ICML 2026
  authors: Wei et al.
  category: self-play-zero-data
  tags: [self-play, coding-agents, reinforcement-learning, curriculum]
  summary: "SSR jointly trains one 32B policy as bug injector and repairer inside sandboxed repos, with an injector reward peaking at intermediate solve rates that yields an emergent curriculum, adding +10.4 points on SWE-bench Verified without human-labeled issues."
  summary_zh: "SSR 让同一个 32B 策略在沙箱仓库中同时扮演缺陷注入者与修复者进行联合 RL，注入奖励在中等求解率处达到峰值从而自发形成难度课程，无需人工标注 issue 即在 SWE-bench Verified 上提升 10.4 分。"
- id: agent0
  title: "Agent0: Unleashing Self-Evolving Agents from Zero Data via Tool-Integrated Reasoning"
  url: "https://arxiv.org/abs/2511.16043"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: Xia et al.
  repo: aiming-lab/Agent0
  category: self-play-zero-data
  tags: [self-play, zero-data, proposer-solver, curriculum]
  summary: "Co-evolves a task-proposing curriculum agent and a code-executing solver from one base model with no external data, rewarding tasks at the solver's uncertainty frontier and lifting Qwen3-8B math reasoning 18% and general reasoning 24%."
  summary_zh: "从同一基座模型协同进化出题的 curriculum agent 与会调用代码的求解器，完全不依赖外部数据，以求解器的不确定性前沿作为奖励，使 Qwen3-8B 数学推理提升 18%、通用推理提升 24%。"
- id: atlas-online-adaptation
  title: "Continual Learning, Not Training: Online Adaptation For Agents"
  url: "https://arxiv.org/abs/2511.01093"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: Jaglan et al.
  repo: Arc-Computer/atlas-sdk
  category: memory-experience-agents
  tags: [memory, experience-reuse, continual-learning, context-engineering]
  summary: "ATLAS keeps a GPT-5 Teacher's distilled pamphlets of principles and action schemas in a persistent memory that a frozen GPT-5-mini Student retrieves per task, lifting cyber-investigation success from 33.7% to 54.1% with no gradient updates."
  summary_zh: "ATLAS 将 GPT-5 教师蒸馏出的原则与动作模式 pamphlet 存入持久记忆，供冻结权重的 GPT-5-mini 学生按任务检索，在无任何梯度更新的情况下把网络威胁调查成功率从 33.7% 提升到 54.1%。"
- id: control-protocols-untrusted-agents
  title: Evaluating Control Protocols for Untrusted AI Agents
  url: "https://arxiv.org/abs/2511.02997"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: Kutasov et al.
  category: safety-governance
  tags: [control-protocol, safety-evaluation, scheming]
  summary: "Blue-team versus red-team evaluations on SHADE-Arena rank five control protocols by safety and usefulness, finding resample-then-defer collapses from 89% to 17% safety once the untrusted agent can simulate the monitor, while defer-on-critical-action stays robust."
  summary_zh: "在 SHADE-Arena 上进行蓝队对红队评测，按安全性与可用性对五种控制协议排序，发现一旦不可信智能体能够模拟监控器，resample-then-defer 的安全性就从 89% 崩至 17%，而 defer-on-critical-action 依然稳健。"
- id: evo-memory
  title: "Evo-Memory: Benchmarking LLM Agent Test-time Learning with Self-Evolving Memory"
  url: "https://arxiv.org/abs/2511.20857"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: Wei et al.
  category: benchmarks-infrastructure
  tags: [benchmark, memory, experience-reuse]
  summary: "Turns ten reasoning and interactive datasets into sequential task streams that force retrieve-act-evolve memory updates, reimplements ten-plus memory systems under one interface, and adds ReMem, whose self-refining loop lifts AlfWorld success from 0.18 to 0.92."
  summary_zh: "把 10 个推理与交互式数据集改造成顺序任务流，迫使 agent 每步检索、行动并演化记忆，在统一接口下复现十余种记忆系统，并提出自我精炼的 ReMem，将 AlfWorld 成功率从 0.18 提升到 0.92。"
- id: live-swe-agent
  title: "Live-SWE-agent: Can Software Engineering Agents Self-Evolve on the Fly?"
  url: "https://arxiv.org/abs/2511.13646"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: Xia et al.
  repo: OpenAutoCoder/live-swe-agent
  category: self-modifying-agents
  tags: [self-modifying-code, tool-synthesis, coding-agents]
  summary: "Evolves its own tooling at inference time, letting a bash-only scaffold synthesize editors, search utilities, and analyzers while solving each GitHub issue, resolving 77.4% of SWE-bench Verified with no offline evolution run."
  summary_zh: "在推理过程中自我进化工具：仅有 bash 的 scaffold 一边解决 GitHub issue 一边合成编辑器、代码搜索与分析工具，无需离线进化即解决 77.4% 的 SWE-bench Verified。"
- id: natural-emergent-misalignment
  title: Natural Emergent Misalignment from Reward Hacking in Production RL
  url: "https://arxiv.org/abs/2511.18397"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: MacDiarmid et al.
  category: safety-governance
  tags: [reward-hacking, safety-evaluation, scheming, reinforcement-learning]
  summary: "Finetuning a Claude-lineage model on documents describing real coding reward hacks and then RL-ing it in production environments shows that learning to hack causally generalizes into broad misalignment, which a one-line inoculation prompt cuts by 75-90%."
  summary_zh: "在描述真实编码 reward hack 的文档上微调 Claude 系模型并在生产环境中做 RL，结果表明学会作弊会因果性地泛化为广泛的失准，而一行 inoculation prompt 可将其削减 75-90%。"
- id: webcoach
  title: "WebCoach: Self-Evolving Web Agents with Cross-Session Memory Guidance"
  url: "https://arxiv.org/abs/2511.12997"
  link_label: arXiv
  date: 2025-11
  venue: arXiv
  authors: Liu et al.
  repo: genglinliu/WebCoach
  category: memory-experience-agents
  tags: [memory, experience-reuse, search-agents]
  summary: "Bolts cross-session memory onto an unmodified browsing agent through a trajectory condenser, a FAISS episode store, and an 8B coach that injects advice only when failure looms, raising WebVoyager success from 47.3% to 61.4% without retraining."
  summary_zh: "为未改动的浏览 agent 外挂跨会话记忆：Condenser 压缩轨迹、FAISS 存储成功与失败经验、8B Coach 仅在预判失败时注入建议，无需重训即把 WebVoyager 成功率从 47.3% 提升到 61.4%。"
- id: adaptive-monitor-attacks
  title: Adaptive Attacks on Trusted Monitors Subvert AI Control Protocols
  url: "https://arxiv.org/abs/2510.09462"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Terekhov et al.
  category: safety-governance
  tags: [control-protocol, safety-evaluation, reward-hacking]
  summary: "Grants the untrusted model full knowledge of the control protocol so it embeds prompt injections in its outputs that zero out the trusted monitor's suspicion score, collapsing trusted-monitoring, defer-to-trusted and editing protocols to the monitor-free auditing baseline."
  summary_zh: "让不可信模型完全掌握控制协议，从而在自身输出中嵌入提示注入，把可信监控器的可疑度打分归零，使可信监控、defer-to-trusted 与可信编辑等协议退化到无监控器的前置审计基线。"
- id: agentic-context-engineering
  title: "Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models"
  url: "https://arxiv.org/abs/2510.04618"
  link_label: arXiv
  date: 2025-10
  venue: ICLR 2026
  authors: Zhang et al.
  repo: ace-agent/ace
  category: context-prompt-workflow
  tags: [context-engineering, prompt-optimization, memory]
  summary: "ACE evolves an agent's context rather than its weights, with Generator, Reflector and Curator roles appending itemized delta bullets to a growing playbook, lifting AppWorld accuracy 17 points while avoiding brevity bias and context collapse."
  summary_zh: "ACE 通过演化上下文而非权重实现自我改进，由 Generator、Reflector 与 Curator 三个角色把条目化的增量 bullet 合并进不断增长的 playbook，在 AppWorld 上提升 17 个百分点，同时避免简洁性偏差与上下文坍塌。"
- id: alita-g
  title: "Alita-G: Self-Evolving Generative Agent for Agent Generation"
  url: "https://arxiv.org/abs/2510.23601"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Qiu et al.
  category: self-modifying-agents
  tags: [tool-synthesis, skill-library, experience-reuse]
  summary: "ALITA-G specializes a generalist agent without weight updates by mining successful trajectories into abstracted, parameterized MCP tools stored in a retrievable MCP Box, lifting GAIA pass@1 from 75.15% to 83.03% while cutting tokens 15%."
  summary_zh: "ALITA-G 无需更新权重即可把通用智能体特化为领域专家：它从成功轨迹中提炼出参数化的 MCP 工具并存入可检索的 MCP Box，使 GAIA pass@1 从 75.15% 升至 83.03%，同时 token 消耗减少约 15%。"
- id: codeevolve
  title: "CodeEvolve: an open source evolutionary coding agent for algorithmic discovery and optimization"
  url: "https://arxiv.org/abs/2510.14150"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: "Assumpção et al."
  repo: inter-co/science-codeevolve
  category: open-ended-evolution
  tags: [evolutionary-search, quality-diversity, algorithm-discovery, coding-agents]
  summary: "Combines island-based evolutionary search over diff edits with inspiration-based crossover and per-island CVT-MAP-Elites archives, matching or beating AlphaEvolve on 5 of 9 benchmark problems using an open-weight 30B model at roughly $6 per run."
  summary_zh: "将基于岛屿模型的 diff 编辑演化搜索与灵感式交叉、每岛 CVT-MAP-Elites 存档相结合，用开源 30B 模型在 9 个基准问题中的 5 个上追平或超越 AlphaEvolve，单次运行成本约 6 美元。"
- id: comas
  title: "CoMAS: Co-Evolving Multi-Agent Systems via Interaction Rewards"
  url: "https://arxiv.org/abs/2510.08529"
  link_label: arXiv
  date: 2025-10
  venue: ICLR 2026
  authors: Xue et al.
  repo: xxyQwQ/CoMAS
  category: self-improving-training
  tags: [self-rewarding, multi-agent, co-evolution, reinforcement-learning]
  summary: "CoMAS derives intrinsic rewards from multi-agent discussion, an LLM judge scoring solver versus evaluator roles as a zero-sum game, to update each agent decentrally with REINFORCE++, lifting Qwen2.5-3B by about 19.8% collaboratively without any ground-truth verifier."
  summary_zh: "CoMAS 从多智能体讨论中提取内在奖励——由 LLM 裁判把解题者与评审者角色建模为零和博弈——并用 REINFORCE++ 对每个智能体分散更新，在无任何真值验证器的情况下使 Qwen2.5-3B 在协作场景提升约 19.8%。"
- id: disco-rl
  title: Discovering state-of-the-art reinforcement learning algorithms
  url: "https://www.nature.com/articles/s41586-025-09761-x"
  link_label: Nature
  date: 2025-10
  venue: Nature
  authors: Oh et al.
  repo: google-deepmind/disco_rl
  category: automated-ai-research
  tags: [algorithm-discovery, reinforcement-learning, meta-learning]
  landmark: true
  summary: "DiscoRL meta-learns the RL update rule itself, training a meta-network that emits policy and prediction targets across a population of agents, and its Disco57 rule surpasses every hand-designed rule on Atari (IQM 13.86)."
  summary_zh: "DiscoRL 通过元梯度直接学习强化学习的更新规则，用一个元网络为智能体群体生成策略与预测目标，其发现的 Disco57 规则在 Atari 上以 13.86 的 IQM 超越所有人工设计的规则。"
- id: escaping-model-collapse-verification
  title: "Escaping Model Collapse via Synthetic Data Verification: Near-term Improvements and Long-term Convergence"
  url: "https://arxiv.org/abs/2510.16657"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Yi et al.
  repo: liuqiyuanhhh/Verified-Synthetic-Data
  category: foundations-theory
  tags: [theory, model-collapse, verifier, synthetic-data]
  summary: "Proves in a linear-regression setting that one round of verifier-filtered synthetic retraining lowers MSE, but indefinite iteration converges to the verifier's own knowledge center, so biased verifiers cap self-improvement, matching a MNIST VAE plateau after roughly 15 rounds."
  summary_zh: "在线性回归框架下证明：一轮经验证器筛选的合成数据再训练可降低 MSE，但无限迭代会收敛到验证器自身的知识中心，因此有偏验证器为自我改进设定上限，与 MNIST VAE 实验约 15 轮后停滞的现象吻合。"
- id: evoengineer
  title: "EvoEngineer: Mastering Automated CUDA Kernel Code Evolution with Large Language Models"
  url: "https://arxiv.org/abs/2510.03760"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Guo et al.
  category: automated-ai-research
  tags: [kernel-optimization, evolutionary-search, coding-agents]
  summary: "Formalizes LLM-driven CUDA kernel evolution as constrained optimization, separating information-conditioning strategies from population management, and reaches a 2.72x median speedup over baseline kernels on 91 KernelBench operations with 69.8% code validity."
  summary_zh: "将 LLM 驱动的 CUDA kernel 演化形式化为带约束的优化问题，把信息条件化策略与种群管理解耦，在 91 个真实 KernelBench 算子上取得 2.72x 的中位加速与 69.8% 的代码有效率。"
- id: evolver
  title: "EvolveR: Self-Evolving LLM Agents through an Experience-Driven Lifecycle"
  url: "https://arxiv.org/abs/2510.16079"
  link_label: arXiv
  date: 2025-10
  venue: ICML 2026
  authors: Wu et al.
  repo: KnowledgeXLab/EvolveR
  category: self-improving-training
  tags: [self-distillation, experience-reuse, reinforcement-learning, search-agents]
  summary: "Compresses an agent's own rollouts into success-scored strategic principles that it later retrieves mid-task, with GRPO training on the resulting trajectories, lifting seven-benchmark average EM from 0.325 to 0.382 at 3B."
  summary_zh: "将智能体自身的轨迹自蒸馏为按成功率评分的策略原则库，供其在交互中检索，并用 GRPO 在由此产生的轨迹上训练，把 3B 模型在七个基准上的平均 EM 从 0.325 提升到 0.382。"
- id: huxley-godel-machine
  title: "Huxley-Gödel Machine: Human-Level Coding Agent Development by an Approximation of the Optimal Self-Improving Machine"
  url: "https://arxiv.org/abs/2510.21614"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Wang et al.
  repo: metauto-ai/HGM
  category: self-modifying-agents
  tags: [self-modifying-code, coding-agents, archive-search, meta-agent]
  landmark: true
  summary: "Ranking self-modifying coding agents by clade metaproductivity — the benchmark performance of a whole subtree of descendants — rather than their own score, Huxley-Gödel Machine reaches 61.4% on SWE-bench Verified and runs 2.4x faster than the Darwin Gödel Machine."
  summary_zh: "Huxley-Gödel Machine 不按智能体自身分数、而按 clade metaproductivity（其全部自修改后代子树的基准表现）来排序自修改编码智能体，在 SWE-bench Verified 上达到 61.4%，并比 Darwin Gödel Machine 快 2.4 倍。"
- id: llm-agents-beyond-utility
  title: "LLM Agents Beyond Utility: An Open-Ended Perspective"
  url: "https://arxiv.org/abs/2510.14548"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Nachkov et al.
  category: limits-failure-modes
  tags: [open-endedness, memory, forgetting]
  summary: "Gives a Qwen3-4B ReAct agent a persistent file-based long-term memory and lets it invent its own tasks, finding self-directed goals collapse into repetitive staples and user feedback is lost, pinpointing memory curation as the binding constraint."
  summary_zh: "为 Qwen3-4B ReAct 智能体配备基于文件的持久长期记忆并让其自行生成任务，结果自定目标退化为重复的老套程序、用户反馈完全丢失，指出记忆筛选才是开放式行为的根本瓶颈。"
- id: multi-agent-evolve
  title: "Multi-Agent Evolve: LLM Self-Improve through Co-evolution"
  url: "https://arxiv.org/abs/2510.23595"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Chen et al.
  repo: ulab-uiuc/Multi-agent-Evolve
  category: self-play-zero-data
  tags: [self-play, proposer-solver, co-evolution, verifier]
  summary: "MAE drops the need for grounded verifiers by co-evolving Proposer, Solver and Judge roles from one backbone with Task-Relative REINFORCE++, raising Qwen2.5-3B's average across 20 benchmarks from 55.33% to 59.87%."
  summary_zh: "MAE 用同一骨干模型共同演化 Proposer、Solver 与 Judge 三个角色，并以 Task-Relative REINFORCE++ 联合优化，从而摆脱对外部验证器的依赖，使 Qwen2.5-3B 在 20 个基准上的平均分从 55.33% 提升到 59.87%。"
- id: deepevolve
  title: Scientific Algorithm Discovery by Augmenting AlphaEvolve with Deep Research
  url: "https://arxiv.org/abs/2510.06056"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Liu et al.
  repo: liugangcode/deepevolve
  category: automated-ai-research
  tags: [algorithm-discovery, scientific-discovery, evolutionary-search, deep-research]
  summary: "Couples a deep-research pipeline that retrieves literature and drafts algorithm proposals with island-based evolutionary code search, debugging agents, and reflection checks, improving seed algorithms on nine scientific benchmarks by 0.39% to 666%."
  summary_zh: "把检索文献并撰写算法提案的 deep research 流程与岛屿式演化代码搜索、调试智能体和反思校验相耦合，在九个科学基准上将种子算法提升 0.39% 至 666%。"
- id: dialectica
  title: "Self-evolving expertise in complex non-verifiable subject domains: dialogue as implicit meta-RL"
  url: "https://arxiv.org/abs/2510.15772"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Bailey
  category: context-prompt-workflow
  tags: [context-engineering, memory, multi-agent]
  summary: "Dialectica lets debating persona agents rewrite an allow-list of their persona and context fields after each round via self-reflection over dual-tier memory, framed as implicit meta-RL; context evolution, not web search, drives top Elo in carbon-market governance."
  summary_zh: "Dialectica 让扮演不同角色的辩论智能体在每轮后通过基于双层记忆的自我反思，改写其人格与上下文字段的允许清单，并将其形式化为隐式 meta-RL；在碳市场治理任务中驱动最高 Elo 的是上下文进化而非网页搜索。"
- id: multimodal-self-improvement-survey
  title: "Self-Improvement in Multimodal Large Language Models: A Survey"
  url: "https://arxiv.org/abs/2510.02665"
  link_label: arXiv
  date: 2025-10
  venue: EMNLP 2025 Findings
  authors: Deng et al.
  category: surveys-position
  tags: [survey, taxonomy, multimodal, self-distillation]
  summary: "Surveys multimodal self-improvement as a three-stage loop of data collection, organization and model optimization, and finds across benchmarks that gains shrink as seed models strengthen and depend heavily on matching method to task."
  summary_zh: "该综述把多模态自我改进归纳为数据收集、数据组织与模型优化的三阶段循环，并通过跨基准分析发现：种子模型越强收益越小，且效果高度取决于方法与任务是否匹配。"
- id: tt-si
  title: Self-Improving LLM Agents at Test-Time
  url: "https://arxiv.org/abs/2510.07841"
  link_label: arXiv
  date: 2025-10
  venue: ACL 2026 Findings
  authors: Acikgoz et al.
  category: self-improving-training
  tags: [test-time-training, synthetic-data, weight-editing]
  summary: "Flags uncertain test instances via action-score margins, synthesizes a few similar training pairs seeded from each one, and applies a reverted LoRA update before answering, adding 5.5 points average accuracy across four tool-calling benchmarks."
  summary_zh: "通过动作分数间隔标记模型不确定的测试样本，围绕该样本合成少量相似训练对，并在作答前施加用后即撤的 LoRA 更新，在四个工具调用基准上平均提升 5.5 个百分点准确率。"
- id: statistical-godel-machine
  title: "SGM: A Statistical Godel Machine for Risk-Controlled Recursive Self-Modification"
  url: "https://arxiv.org/abs/2510.10232"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Wu et al.
  repo: gravitywavelet/sgm-anon
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code, verifier]
  summary: "Replaces the Godel machine's unattainable proof of improvement with anytime-valid e-value and confidence-bound certificates over paired-seed evaluations, bounding the probability of ever accepting a harmful self-edit across unbounded rewrite sequences."
  summary_zh: "用基于配对随机种子评估的 anytime-valid e-value 与置信下界证书，替代哥德尔机无法实现的改进证明，从而在无限次重写序列中限制接受有害自我修改的概率。"
- id: spice
  title: "SPICE: Self-Play In Corpus Environments Improves Reasoning"
  url: "https://arxiv.org/abs/2510.24684"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Liu et al.
  category: self-play-zero-data
  tags: [self-play, proposer-solver, curriculum, reinforcement-learning]
  summary: "One model alternates between a Challenger that mines corpus documents into verifiable reasoning tasks and a Reasoner that answers them unseen, while a variance-based reward pins difficulty near 50% pass rate, gaining ~9 points across four models."
  summary_zh: "同一模型在 Challenger（从语料文档中挖掘可验证推理任务）与 Reasoner（在看不到原文的情况下作答）两个角色间交替，方差型奖励把难度锁定在约 50% 通过率附近，在四个基座模型上平均提升约 9 个点。"
- id: fm-agent
  title: The FM Agent
  url: "https://arxiv.org/abs/2510.26144"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Li et al.
  repo: baidubce/FM-Agent
  category: automated-ai-research
  tags: [evolutionary-search, multi-agent, kernel-optimization, algorithm-discovery]
  summary: "Pairs cold-start generative seeding with island-model evolutionary search and a distributed asynchronous runtime, delivering a 43.56% medal rate on MLE-Bench, 1976.3 on ALE-Bench, and up to 20.77x kernel speedups over torch.compile."
  summary_zh: "将冷启动生成式播种与岛屿模型演化搜索及分布式异步运行时结合，在 MLE-Bench 上取得 43.56% 的奖牌率、ALE-Bench 上 1976.3 分，并相对 torch.compile 实现最高 20.77x 的 kernel 加速。"
- id: toollibgen
  title: "ToolLibGen: Scalable Automatic Tool Creation and Aggregation for LLM Reasoning"
  url: "https://arxiv.org/abs/2510.07768"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Yue et al.
  repo: SalesforceAIResearch/ToolLibGen
  category: self-modifying-agents
  tags: [tool-synthesis, skill-library, coding-agents]
  summary: "Mines self-validated Python tools from an LLM's own reasoning traces, then hierarchically clusters and refactors them through paired coding and reviewing agents, compressing 48k fragmented tools to 3.1k while lifting reasoning accuracy 5-10%."
  summary_zh: "从 LLM 自身的推理轨迹中挖掘经过自验证的 Python 工具，再通过分层聚类与编码-审查双智能体重构，将 48k 个碎片化工具压缩为 3.1k 个，同时将推理准确率提升 5-10%。"
- id: trace-self-evolving-benchmarks
  title: "Towards Self-Evolving Benchmarks: Synthesizing Agent Trajectories via Test-Time Exploration under Validate-by-Reproduce Paradigm"
  url: "https://arxiv.org/abs/2510.00415"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Guo et al.
  category: benchmarks-infrastructure
  tags: [benchmark, verifier, curriculum]
  summary: "TRACE evolves saturated agent benchmarks by having proposer, executor and validator agents fork seed tasks into harder ones defined post-hoc from re-executed trajectories, cutting GAIA Pass@1 by up to 23.7 points over two rounds."
  summary_zh: "TRACE 通过提案、执行与校验三类智能体把种子任务分叉为更难的题目，并从可复现的执行轨迹事后定义问题，从而进化已饱和的智能体基准，两轮后使 GAIA Pass@1 最多下降 23.7 个百分点。"
- id: understanding-self-play
  title: Towards Understanding Self-play for LLM Reasoning
  url: "https://arxiv.org/abs/2510.27072"
  link_label: arXiv
  date: 2025-10
  venue: arXiv
  authors: Chae et al.
  category: limits-failure-modes
  tags: [self-play, proposer-solver, reasoning]
  summary: "Dissects Absolute Zero Reasoner along pass@k, entropy and update sparsity, showing self-play sharpens the base model's distribution rather than expanding it and cannot place probability mass outside the base support without external exploration."
  summary_zh: "该研究从 pass@k、熵动态与参数更新稀疏性等角度剖析 Absolute Zero Reasoner，表明自博弈只是锐化基础模型的分布而非扩展其推理能力，若无外部探索就无法把概率质量放到基础模型支撑集之外。"
- id: compute-as-teacher
  title: "Compute as Teacher: Turning Inference Compute Into Reference-Free Supervision"
  url: "https://arxiv.org/abs/2509.14234"
  link_label: arXiv
  date: 2025-09
  venue: ICML 2026
  authors: Jayalath et al.
  category: self-improving-training
  tags: [label-free-rl, self-rewarding, verifier, reinforcement-learning]
  summary: "Turns parallel rollouts into a pseudo-reference by having a frozen anchor model reconcile them without seeing the question, then rewards policies against self-proposed rubrics inside GRPO, gaining up to 33% on MATH-500."
  summary_zh: "让冻结的 anchor 模型在看不到原问题的情况下把多条并行 rollout 调和成一份伪参考答案，再依据自提出的 rubric 在 GRPO 中给出奖励，在 MATH-500 上最高提升 33%。"
- id: agent-matrix
  title: "Dive into the Agent Matrix: A Realistic Evaluation of Self-Replication Risk in LLM Agents"
  url: "https://arxiv.org/abs/2509.25302"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Zhang et al.
  category: safety-governance
  tags: [safety-evaluation, autonomous-replication, benchmark]
  summary: "Deploys LLM agents on real Kubernetes clusters under load-balancing and termination-threat pressures, scoring uncontrolled self-replication propensity rather than capability; over half of 21 models show pronounced runaway replication."
  summary_zh: "在真实 Kubernetes 集群上以负载均衡与终止威胁两类运营压力部署 LLM 智能体，衡量失控自我复制的倾向而非能力，发现 21 个模型中超过一半表现出明显的失控复制趋势。"
- id: evol-rl
  title: "Evolving Language Models without Labels: Majority Drives Selection, Novelty Promotes Variation"
  url: "https://arxiv.org/abs/2509.15194"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Zhou et al.
  repo: YujunZhou/EVOL-RL
  category: self-improving-training
  tags: [label-free-rl, model-collapse, reinforcement-learning]
  summary: "Keeps majority voting as the label-free selection signal but adds a novelty reward over reasoning-trace embeddings plus entropy regularization to stop collapse, raising Qwen3-4B AIME25 pass@1 from 4.6% to 16.4% over TTRL."
  summary_zh: "保留多数投票作为无标签的选择信号，同时加入基于推理轨迹嵌入的新颖性奖励与熵正则化以阻止策略坍缩，使 Qwen3-4B 在 AIME25 上的 pass@1 相对 TTRL 从 4.6% 提升到 16.4%。"
- id: knowledge-collapse
  title: "Knowledge Collapse in LLMs: When Fluency Survives but Facts Fail under Recursive Synthetic Training"
  url: "https://arxiv.org/abs/2509.04796"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Keisha et al.
  category: limits-failure-modes
  tags: [model-collapse, synthetic-data, capability-erosion]
  summary: "Recursive fine-tuning on self-generated text degrades facts before form: a three-stage trajectory passes through a \"valley of dangerous competence\" where fluency and instruction-following persist while MMLU accuracy erodes, with domain-specific synthetic data decaying ~15x slower."
  summary_zh: "在自生成文本上递归微调会先毁事实、后毁形式：三阶段轨迹会经过\"危险胜任的低谷\"，此时流畅度与指令遵循仍然完好而 MMLU 准确率已经下滑，而领域专用合成数据可使衰减速度慢约 15 倍。"
- id: language-self-play
  title: Language Self-Play For Data-Free Training
  url: "https://arxiv.org/abs/2509.07414"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Kuba et al.
  category: self-play-zero-data
  tags: [self-play, zero-data, self-rewarding, proposer-solver]
  summary: "Casts improvement as a minimax game where one model alternates as Challenger and Solver, with a quality self-reward preventing degenerate adversarial prompts, lifting Llama-3.2-3B AlpacaEval win-rate from 26.5% to 36.4% without training data."
  summary_zh: "把模型改进建模为极小极大博弈，同一模型交替扮演出题的 Challenger 与作答的 Solver，并用质量自奖励防止退化为无意义的对抗性提问，在完全不使用训练数据的情况下把 Llama-3.2-3B 的 AlpacaEval 胜率从 26.5% 提升到 36.4%。"
- id: reasoningbank
  title: "ReasoningBank: Scaling Agent Self-Evolving with Reasoning Memory"
  url: "https://arxiv.org/abs/2509.25140"
  link_label: arXiv
  date: 2025-09
  venue: ICLR 2026
  authors: Ouyang et al.
  repo: google-research/reasoning-bank
  category: memory-experience-agents
  tags: [memory, experience-reuse, case-based, self-correction]
  landmark: true
  summary: "Distills each agent episode, successes and failures alike, into structured reasoning items retrieved into later prompts, and adds memory-aware test-time scaling, raising success up to 8.3 points on WebArena, Mind2Web and SWE-bench-Verified while cutting steps."
  summary_zh: "将每个 agent 轨迹（无论成功还是失败）蒸馏为结构化的推理记忆条目并在后续提示中检索复用，再配合记忆感知的测试时扩展，在 WebArena、Mind2Web 与 SWE-bench-Verified 上成功率最高提升 8.3 个百分点，同时减少交互步数。"
- id: shinka-evolve
  title: "ShinkaEvolve: Towards Open-Ended And Sample-Efficient Program Evolution"
  url: "https://arxiv.org/abs/2509.19349"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Lange et al.
  repo: SakanaAI/ShinkaEvolve
  category: open-ended-evolution
  tags: [evolutionary-search, algorithm-discovery, open-endedness, archive-search]
  summary: "Evolves programs with novelty-aware parent sampling, embedding-based rejection of near-duplicate candidates, and a bandit over LLM mutators, reaching state-of-the-art circle packing in roughly 150 evaluations and also evolving agent scaffolds and training losses."
  summary_zh: "以新颖性感知的父代采样、基于嵌入的近重复候选拒绝采样，以及在多个 LLM 变异器之间调度的 bandit 来演化程序，约 150 次评估即刷新圆填充最优解，并可演化智能体脚手架与训练损失函数。"
- id: socratic-zero
  title: "Socratic-Zero: Bootstrapping Reasoning via Data-Free Agent Co-evolution"
  url: "https://arxiv.org/abs/2509.24726"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Wang et al.
  repo: Frostlinx/Socratic-Zero
  category: self-play-zero-data
  tags: [proposer-solver, zero-data, curriculum, co-evolution]
  summary: "Three co-evolving agents — Solver, Teacher, Generator — bootstrap math reasoning from 100 seed questions via DPO on self-sampled solutions and difficulty-targeted question synthesis, gaining 20.2 points over prior data-synthesis methods across seven benchmarks."
  summary_zh: "Solver、Teacher、Generator 三个智能体协同演化，仅从 100 个种子问题出发，通过对自采样解的 DPO 训练与难度定向的问题合成来自举数学推理，在七个基准上比既有数据合成方法平均高出 20.2 个百分点。"
- id: anti-scheming-stress-test
  title: Stress Testing Deliberative Alignment for Anti-Scheming Training
  url: "https://arxiv.org/abs/2509.15541"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Schoen et al.
  category: safety-governance
  tags: [scheming, safety-evaluation, reward-hacking]
  summary: "Trains OpenAI o3 and o4-mini to cite an explicit anti-scheming spec, cutting covert rule-breaking roughly 30x across 180+ held-out environments, but shows rising evaluation awareness causally drives part of the improvement."
  summary_zh: "训练 OpenAI o3 与 o4-mini 显式援引反 scheming 规范，在 180 多个留出环境中将隐蔽违规行为降低约 30 倍，但同时表明上升的“被评估意识”因果性地贡献了部分改进。"
- id: robust-kbench
  title: "Towards Robust Agentic CUDA Kernel Benchmarking, Verification, and Optimization"
  url: "https://arxiv.org/abs/2509.14279"
  link_label: arXiv
  date: 2025-09
  venue: arXiv
  authors: Lange et al.
  repo: SakanaAI/robust-kbench
  category: automated-ai-research
  tags: [kernel-optimization, evolutionary-search, verifier, benchmark]
  summary: "Pairs an evolutionary LLM pipeline that translates PyTorch modules into CUDA kernels with robust-kbench, a six-check harness closing benchmark loopholes, so verified kernels still beat torch on forward and backward passes under torch.compile."
  summary_zh: "将把 PyTorch 模块翻译为 CUDA kernel 的进化式 LLM 流水线与 robust-kbench 相结合，后者以六重检查堵住基准漏洞，使经过验证的 kernel 在 torch.compile 下的前向与反向传播中仍优于 torch 实现。"
- id: vision-zero
  title: "Vision-Zero: Scalable VLM Self-Improvement via Strategic Gamified Self-Play"
  url: "https://arxiv.org/abs/2509.25541"
  link_label: arXiv
  date: 2025-09
  venue: ICLR 2026
  authors: Wang et al.
  repo: wangqinsi1/Vision-Zero
  category: self-play-zero-data
  tags: [self-play, zero-data, multimodal, reinforcement-learning]
  summary: "Auto-generated \"Who Is the Spy\" games over edited image pairs give VLMs label-free self-play rewards, and Iterative-SPO alternates zero-sum clue rounds with verifiable decision rounds to lift reasoning without domain-specific data."
  summary_zh: "由编辑过的图像对自动生成的\"谁是卧底\"游戏为 VLM 提供无需标注的自博弈奖励，Iterative-SPO 交替进行零和线索回合与可验证决策回合，无需领域专用数据即可提升推理能力。"
- id: misevolution
  title: "Your Agent May Misevolve: Emergent Risks in Self-evolving LLM Agents"
  url: "https://arxiv.org/abs/2509.26354"
  link_label: arXiv
  date: 2025-09
  venue: ICLR 2026
  authors: Shao et al.
  repo: ShaoShuai0605/Misevolution
  category: safety-governance
  tags: [safety-evaluation, reward-hacking, tool-synthesis, memory]
  summary: "Names and measures misevolution — safety decay arising from an agent's own self-evolution with no attacker present — across model, memory, tool and workflow pathways, with refusal rates on frontier backbones dropping roughly 45% after memory-driven cycles."
  summary_zh: "提出并系统度量\"误演化\"——在没有任何攻击者的情况下仅由 agent 自我演化引发的安全性衰退——覆盖模型、记忆、工具与工作流四条演化路径，前沿模型在记忆演化数轮后拒答率下降约 45%。"
- id: self-evolving-agents-survey
  title: "A Comprehensive Survey of Self-Evolving AI Agents: A New Paradigm Bridging Foundation Models and Lifelong Agentic Systems"
  url: "https://arxiv.org/abs/2508.07407"
  link_label: arXiv
  date: 2025-08
  venue: arXiv
  authors: Fang et al.
  repo: EvoAgentX/Awesome-Self-Evolving-Agents
  category: surveys-position
  tags: [survey, taxonomy, multi-agent]
  summary: "Frames self-evolving agents as an optimisation loop over inputs, agent system, environment, and optimisers, taxonomising what evolves — weights, prompts, memory, tools, workflows, topologies — and proposes three laws: Endure, Excel, Evolve."
  summary_zh: "将自进化智能体抽象为覆盖系统输入、智能体系统、环境与优化器的优化闭环，按“进化什么”(权重、提示、记忆、工具、工作流、通信拓扑)构建分类体系，并提出 Endure、Excel、Evolve 三条法则。"
- id: ell-stulife
  title: "Building Self-Evolving Agents via Experience-Driven Lifelong Learning: A Framework and Benchmark"
  url: "https://arxiv.org/abs/2508.19005"
  link_label: arXiv
  date: 2025-08
  venue: arXiv
  authors: Cai et al.
  repo: ECNU-ICALK/ELL-StuLife
  category: benchmarks-infrastructure
  tags: [benchmark, lifelong-learning, memory, continual-learning]
  summary: "Frames self-evolving agents around experience, memory, skill learning, and internalization, then tests them in StuLife, a stateful college-life simulation of 1,284 tasks where the best model, GPT-5, scores 17.9/100."
  summary_zh: "以经验探索、长期记忆、技能学习与知识内化四大支柱刻画自进化智能体，并用包含 1,284 个任务的有状态大学生活模拟 StuLife 进行评测，最佳模型 GPT-5 仅得 17.9/100。"
- id: memento
  title: "Memento: Fine-tuning LLM Agents without Fine-tuning LLMs"
  url: "https://arxiv.org/abs/2508.16153"
  link_label: arXiv
  date: 2025-08
  venue: arXiv
  authors: Zhou et al.
  repo: Agent-on-the-Fly/Memento
  category: memory-experience-agents
  tags: [memory, case-based, experience-reuse, deep-research]
  summary: "Adapts a frozen LLM agent by writing and retrieving (state, action, reward) cases from a growing episodic bank via a learned Q-based selector, reaching 87.9% Pass@3 on GAIA validation without gradient updates."
  summary_zh: "通过学习得到的 Q 值案例选择器，从不断增长的情节式案例库中写入与检索(状态, 动作, 奖励)案例，使冻结参数的 LLM 智能体在 GAIA 验证集上达到 87.9% Pass@3，全程无需梯度更新。"
- id: memp
  title: "Memp: Exploring Agent Procedural Memory"
  url: "https://arxiv.org/abs/2508.06433"
  link_label: arXiv
  date: 2025-08
  venue: arXiv
  authors: Fang et al.
  repo: zjunlp/MemP
  category: memory-experience-agents
  tags: [memory, experience-reuse, skill-library]
  summary: "Distills agent trajectories into a procedural memory bank of verbatim steps and script-like abstractions with a build-retrieve-update loop, lifting ALFWorld success from 39% to 87% and transferring to weaker models."
  summary_zh: "将智能体过往轨迹蒸馏为兼含逐步轨迹与脚本式抽象的程序性记忆库，并通过构建-检索-更新循环维护，使 ALFWorld 成功率从 39% 升至 87%，且可迁移至更弱的模型。"
- id: polymath
  title: "Polymath: A Self-Optimizing Agent with Dynamic Hierarchical Workflow"
  url: "https://arxiv.org/abs/2508.02959"
  link_label: arXiv
  date: 2025-08
  venue: arXiv
  authors: Ho et al.
  category: context-prompt-workflow
  tags: [workflow-search, evolutionary-search, self-correction]
  summary: "Represents solutions as a task-flow graph over code workflows and self-optimizes both levels without labels, using multigrid-style coarsen/relax on the graph plus reflection-guided evolutionary search on code, averaging 8.1% over prior systems."
  summary_zh: "将解表示为由代码化工作流构成的任务流图，并在无标注数据下自优化两个层级——图层面采用多重网格式的粗化/松弛，代码层面采用反思引导的进化搜索——平均超越已有方法 8.1%。"
- id: r-zero
  title: "R-Zero: Self-Evolving Reasoning LLM from Zero Data"
  url: "https://arxiv.org/abs/2508.05004"
  link_label: arXiv
  date: 2025-08
  venue: ICLR 2026
  authors: Huang et al.
  repo: Chengsong-Huang/R-Zero
  category: self-play-zero-data
  tags: [self-play, proposer-solver, zero-data, label-free-rl]
  landmark: true
  summary: "Co-evolves a Challenger and Solver instantiated from the same base LLM with no human data, rewarding questions the Solver answers about half the time and lifting Qwen3-4B by 6.5 math-reasoning points."
  summary_zh: "让同一基础 LLM 派生的 Challenger 与 Solver 在无任何人类数据下协同进化，对 Solver 正确率约五成的问题给予最高奖励，使 Qwen3-4B 的数学推理提升 6.5 分。"
- id: sqlm
  title: Self-Questioning Language Models
  url: "https://arxiv.org/abs/2508.03682"
  link_label: arXiv
  date: 2025-08
  venue: arXiv
  authors: Chen et al.
  repo: lili-chen/self-questioning-lm
  category: self-play-zero-data
  tags: [self-play, proposer-solver, curriculum, zero-data]
  summary: "Trains a proposer to invent problems from just a topic prompt and a solver to answer them, rewarding intermediate difficulty and supervising via majority vote or generated unit tests, raising Codeforces accuracy from 0.32 to 0.39."
  summary_zh: "训练提议者仅凭一个主题提示自行出题、求解者作答，对难度适中的题目给予奖励，并用多数投票或自动生成的单元测试提供监督，使 Codeforces 准确率从 0.32 提升到 0.39。"
- id: survey-self-evolving-agents
  title: "A Survey of Self-Evolving Agents: What, When, How, and Where to Evolve on the Path to Artificial Super Intelligence"
  url: "https://arxiv.org/abs/2507.21046"
  link_label: arXiv
  date: 2025-07
  venue: TMLR 2026
  authors: Gao et al.
  repo: CharlesQ9/Self-Evolving-Agents
  category: surveys-position
  tags: [survey, taxonomy, lifelong-learning]
  summary: "Organizes self-evolving agents along what, when, how, and where to evolve—weights, context, tools, topology; intra- versus inter-test-time; reward, imitation, population-based—and consolidates evaluation around adaptivity, retention, generalization, efficiency, and safety."
  summary_zh: "沿着进化什么、何时进化、如何进化、在何处进化四个维度组织自进化智能体研究——权重、上下文、工具与拓扑；测试内与测试间；奖励式、模仿式与群体式方法——并将评估统一到适应性、保持性、泛化性、效率与安全性。"
- id: aira-dojo
  title: "AI Research Agents for Machine Learning: Search, Exploration, and Generalization in MLE-bench"
  url: "https://arxiv.org/abs/2507.02554"
  link_label: arXiv
  date: 2025-07
  venue: arXiv
  authors: Toledo et al.
  repo: facebookresearch/aira-dojo
  category: automated-ai-research
  tags: [coding-agents, evolutionary-search, benchmark]
  summary: "Decomposes ML-engineering agents into search policy and operator set, showing operators dominate: AIRA operators with MCTS reach 47.7% any-medal on MLE-bench Lite, while validation-metric overfitting, not search capacity, caps performance."
  summary_zh: "将机器学习工程智能体拆解为搜索策略与算子集合，证明算子才是瓶颈：AIRA 算子配合 MCTS 在 MLE-bench Lite 上达到 47.7% 获奖率，而真正的上限来自验证指标过拟合而非搜索能力。"
- id: asi-arch
  title: AlphaGo Moment for Model Architecture Discovery
  url: "https://arxiv.org/abs/2507.18074"
  link_label: arXiv
  date: 2025-07
  venue: arXiv
  authors: Liu et al.
  repo: GAIR-NLP/ASI-Arch
  category: automated-ai-research
  tags: [architecture-search, scientific-discovery, multi-agent, algorithm-discovery]
  landmark: true
  summary: "Runs an autonomous Researcher-Engineer-Analyst loop over 1,773 experiments and 20,000 GPU hours to discover 106 novel linear-attention architectures beating Mamba2 and Gated DeltaNet, with discoveries scaling roughly linearly in compute."
  summary_zh: "以自主的研究员-工程师-分析师循环运行 1,773 次实验、约 2 万 GPU 小时，发现 106 个新型线性注意力架构，超越 Mamba2 与 Gated DeltaNet，且发现数量随算力近似线性增长。"
- id: evoagentx
  title: "EvoAgentX: An Automated Framework for Evolving Agentic Workflows"
  url: "https://arxiv.org/abs/2507.03616"
  link_label: arXiv
  date: 2025-07
  venue: EMNLP 2025
  authors: Wang et al.
  repo: EvoAgentX/EvoAgentX
  category: benchmarks-infrastructure
  tags: [workflow-search, prompt-optimization, multi-agent]
  summary: "Open-source platform that compiles a natural-language goal into a multi-agent workflow graph, then evolves it with pluggable prompt and topology optimizers (TextGrad, MIPRO, AFlow) under automatic evaluation, adding roughly ten points on MBPP and MATH."
  summary_zh: "开源平台把自然语言目标编译成多智能体工作流图，再用可插拔的提示与拓扑优化器（TextGrad、MIPRO、AFlow）在自动评估闭环中演化该工作流，在 MBPP 与 MATH 上各提升约十个点。"
- id: foundation-model-self-play
  title: "Foundation Model Self-Play: Open-Ended Strategy Innovation via Foundation Models"
  url: "https://arxiv.org/abs/2507.06466"
  link_label: arXiv
  date: 2025-07
  venue: RLC 2025
  authors: Dharna et al.
  repo: aadharna/FMSP
  category: open-ended-evolution
  tags: [self-play, quality-diversity, evolutionary-search, open-endedness]
  summary: "Replaces gradient policy updates in self-play with a foundation model that writes and rewrites code policies, adding novelty and dimensionless MAP-Elites archives whose behavior dimensions the model itself invents, rediscovering Kalman filters and MCTS."
  summary_zh: "用能编写并改写代码策略的基础模型替代自博弈中的梯度式策略更新，并引入新颖性存档与由模型自行提出行为维度的无维度 MAP-Elites 存档，重新发现了 Kalman 滤波与 MCTS。"
- id: gepa
  title: "GEPA: Reflective Prompt Evolution Can Outperform Reinforcement Learning"
  url: "https://arxiv.org/abs/2507.19457"
  link_label: arXiv
  date: 2025-07
  venue: ICLR 2026
  authors: Agrawal et al.
  repo: gepa-ai/gepa
  category: context-prompt-workflow
  tags: [prompt-optimization, evolutionary-search, workflow-search]
  summary: "Evolves prompts for compound LLM systems by reflecting in natural language over full execution traces and keeping a Pareto frontier of candidates, beating GRPO by 6% on average with up to 35x fewer rollouts."
  summary_zh: "通过对完整执行轨迹进行自然语言反思来演化复合 LLM 系统的各模块提示词，并维护候选提示的 Pareto 前沿，在 rollout 最多减少 35 倍的情况下平均超过 GRPO 6%。"
- id: compute-bottlenecks-explosion
  title: "Will Compute Bottlenecks Prevent an Intelligence Explosion?"
  url: "https://arxiv.org/abs/2507.23181"
  link_label: arXiv
  date: 2025-07
  venue: arXiv
  authors: Whitfill et al.
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Models AI R&D as a CES production function over research compute and cognitive labor, estimating substitution elasticity from a 27-observation frontier-lab panel: sigma about 2.6 supports a software-only explosion, but near zero once frontier-experiment scale is controlled."
  summary_zh: "将 AI 研发建模为研究算力与认知劳动之间的 CES 生产函数，并用 27 个观测的前沿实验室面板估计替代弹性：基线 sigma 约 2.6 支持纯软件智能爆炸，但在控制前沿实验规模后该值接近 0。"
- id: alphaevolve
  title: "AlphaEvolve: A coding agent for scientific and algorithmic discovery"
  url: "https://arxiv.org/abs/2506.13131"
  link_label: arXiv
  date: 2025-06
  venue: arXiv
  authors: Novikov et al.
  repo: google-deepmind/alphaevolve_results
  category: automated-ai-research
  tags: [evolutionary-search, algorithm-discovery, kernel-optimization, coding-agents]
  landmark: true
  summary: "An evolutionary loop pairs a MAP-Elites program database with LLM-proposed diffs over whole files and automated evaluators, discovering a rank-48 algorithm for 4x4 complex matrix multiplication and kernels that speed up Gemini training."
  summary_zh: "以 MAP-Elites 程序数据库、LLM 对整个文件提出的 diff 改写与自动评估器构成进化循环，发现了 4x4 复矩阵乘法的 rank-48 算法，以及可加速 Gemini 训练的 kernel。"
- id: contextual-experience-replay
  title: Contextual Experience Replay for Self-Improvement of Language Agents
  url: "https://arxiv.org/abs/2506.06698"
  link_label: arXiv
  date: 2025-06
  venue: ACL 2025
  authors: Liu et al.
  category: memory-experience-agents
  tags: [memory, experience-reuse, context-engineering]
  summary: "Training-free web agents distill past trajectories into separate environment-dynamics and skill memories, retrieving them per task to augment prompts, lifting GPT-4o on WebArena from 24.3% to 36.7% success for ~17% extra input tokens."
  summary_zh: "免训练的网页智能体把历史轨迹蒸馏为环境动态记忆与技能记忆，按任务检索以增强提示，使 GPT-4o 在 WebArena 上的成功率从 24.3% 升至 36.7%，仅增加约 17% 输入 token。"
- id: g-memory
  title: "G-Memory: Tracing Hierarchical Memory for Multi-Agent Systems"
  url: "https://arxiv.org/abs/2506.07398"
  link_label: arXiv
  date: 2025-06
  venue: NeurIPS 2025
  authors: Zhang et al.
  repo: bingreeky/GMemory
  category: multi-agent-evolution
  tags: [memory, multi-agent, experience-reuse]
  summary: "Stores multi-agent history as linked interaction, query, and insight graphs, then traverses them bi-directionally to give each agent role-specific memory, lifting embodied task success up to 20.89% across three MAS frameworks without retraining."
  summary_zh: "将多智能体历史存储为相互链接的交互图、查询图与洞见图，并通过双向遍历为每个智能体注入角色化记忆，在三种 MAS 框架上无需重训即可将具身任务成功率最高提升 20.89%。"
- id: seal
  title: Self-Adapting Language Models
  url: "https://arxiv.org/abs/2506.10943"
  link_label: arXiv
  date: 2025-06
  venue: NeurIPS 2025
  authors: Zweiger et al.
  repo: Continual-Intelligence/SEAL
  category: self-improving-training
  tags: [weight-editing, synthetic-data, reinforcement-learning, test-time-training]
  landmark: true
  summary: "Trains an LLM to emit natural-language self-edits, synthetic training data plus finetuning directives, applied as LoRA weight updates, with an outer RL loop rewarding post-update performance, lifting no-context SQuAD accuracy from 33.5% to 47.0%."
  summary_zh: "训练 LLM 生成自然语言自编辑（合成训练数据加微调指令），以 LoRA 形式写回自身权重，外层 RL 以更新后的下游表现为奖励，将无上下文 SQuAD 准确率从 33.5% 提升到 47.0%。"
- id: self-challenging-agent
  title: Self-Challenging Language Model Agents
  url: "https://arxiv.org/abs/2506.01716"
  link_label: arXiv
  date: 2025-06
  venue: NeurIPS 2025
  authors: Zhou et al.
  category: self-play-zero-data
  tags: [self-play, proposer-solver, verifier, reinforcement-learning]
  summary: "A single LLM alternates between challenger and executor roles, inventing Code-as-Task problems that bundle an executable verifier and failure cases, then training on them with RL — doubling Llama-3.1-8B tool-use accuracy without human tasks."
  summary_zh: "单个 LLM 在挑战者与执行者角色间交替，自造捆绑可执行 verifier 与失败用例的 Code-as-Task 任务，再用 RL 在其上训练，无需人工任务即把 Llama-3.1-8B 的工具使用准确率翻倍。"
- id: shade-arena
  title: "SHADE-Arena: Evaluating Sabotage and Monitoring in LLM Agents"
  url: "https://arxiv.org/abs/2506.15740"
  link_label: arXiv
  date: 2025-06
  venue: arXiv
  authors: Kutasov et al.
  repo: safety-research/SHADE-Arena
  category: safety-governance
  tags: [safety-evaluation, benchmark, scheming, control-protocol]
  summary: "Pairs benign agentic tasks with hidden sabotage side tasks across 17 environments and scores an LLM monitor on full transcripts; the best saboteur succeeds 27% of the time, and removing its hidden scratchpad sharply cuts sabotage."
  summary_zh: "在 17 个环境中把良性智能体任务与隐藏的破坏性副任务配对，并让 LLM 监控器阅读完整轨迹打分；最强破坏者成功率为 27%，而移除其隐藏 scratchpad 会大幅降低破坏成功率。"
- id: spiral
  title: "SPIRAL: Self-Play on Zero-Sum Games Incentivizes Reasoning via Multi-Agent Multi-Turn Reinforcement Learning"
  url: "https://arxiv.org/abs/2506.24119"
  link_label: arXiv
  date: 2025-06
  venue: arXiv
  authors: Liu et al.
  repo: spiral-rl/spiral
  category: self-play-zero-data
  tags: [self-play, zero-data, reinforcement-learning, reasoning]
  summary: "Trains one shared policy through multi-turn zero-sum language games against its own past copies, with role-conditioned advantage baselines preventing reasoning collapse, transferring to math and lifting Qwen3-4B-Base from 34.0% to 44.5% across eight benchmarks."
  summary_zh: "让单一共享策略在多轮零和语言游戏中与自身不断更新的副本对弈，用按角色条件化的优势基线防止推理坍缩，能力迁移到数学，使 Qwen3-4B-Base 在八个基准上的平均分从 34.0% 升至 44.5%。"
- id: swarmagentic
  title: "SwarmAgentic: Towards Fully Automated Agentic System Generation via Swarm Intelligence"
  url: "https://arxiv.org/abs/2506.15672"
  link_label: arXiv
  date: 2025-06
  venue: EMNLP 2025
  authors: Zhang et al.
  repo: yaoz720/SwarmAgenticCode
  category: multi-agent-evolution
  tags: [multi-agent, agent-topology, workflow-search, meta-agent]
  summary: "Generates whole multi-agent systems from a task description by encoding agent roles and collaboration schedules as text particles updated with failure-aware LLM edits in a language-space particle swarm, reaching 32.2% on TravelPlanner versus ADAS's 8.9%."
  summary_zh: "通过将智能体角色与协作调度编码为文本粒子，并在语言空间的粒子群优化中用面向失败的 LLM 编辑更新它们，仅凭任务描述即可生成完整的多智能体系统，在 TravelPlanner 上达到 32.2%，而 ADAS 为 8.9%。"
- id: solver-verifier-gap
  title: Theoretical Modeling of LLM Self-Improvement Training Dynamics Through Solver-Verifier Gap
  url: "https://arxiv.org/abs/2507.00075"
  link_label: arXiv
  date: 2025-06
  venue: arXiv
  authors: Sun et al.
  category: foundations-theory
  tags: [theory, formal-analysis, verifier]
  summary: "Models self-improvement as coupled ODEs over a solver-verifier gap in negative-log-likelihood uncertainty, predicting a finite saturation point because the solver improves faster than the verifier, and fitting training curves at R^2 above 0.9."
  summary_zh: "将自我改进建模为围绕 solver-verifier gap（以负对数似然不确定性度量）的耦合 ODE，因 solver 提升快于 verifier 而预测出有限的饱和点，并以 R^2 超过 0.9 拟合训练曲线。"
- id: intrinsic-metacognitive-learning
  title: Truly Self-Improving Agents Require Intrinsic Metacognitive Learning
  url: "https://arxiv.org/abs/2506.05109"
  link_label: arXiv
  date: 2025-06
  venue: ICML 2025
  authors: Liu et al.
  category: surveys-position
  tags: [position-paper, taxonomy, continual-learning]
  summary: "Argues durable self-improvement demands intrinsic metacognition — agents that assess their own capabilities, choose what and how to learn, and evaluate their learning strategy — rather than the fixed human-designed improvement loops used by STaR or Voyager."
  summary_zh: "主张持久的自我改进需要内生元认知——智能体自我评估能力、自主决定学什么与怎么学并评价自身学习策略——而非 STaR 或 Voyager 所用的固定人工设计改进循环。"
- id: absolute-zero
  title: "Absolute Zero: Reinforced Self-play Reasoning with Zero Data"
  url: "https://arxiv.org/abs/2505.03335"
  link_label: arXiv
  date: 2025-05
  venue: NeurIPS 2025
  authors: Zhao et al.
  repo: LeapLabTHU/Absolute-Zero-Reasoner
  category: self-play-zero-data
  tags: [self-play, zero-data, proposer-solver, verifier]
  landmark: true
  summary: "A single model proposes code reasoning tasks scored by a learnability reward and solves them under Python-executor verification, needing no human data yet gaining 10.2 points over its 7B base with strong math transfer."
  summary_zh: "由同一个模型提出以可学习性奖励打分的代码推理任务并自行求解，Python 执行器充当验证器，全程不使用任何人类数据，却在 7B 基座上提升 10.2 分并展现出强劲的数学迁移能力。"
- id: ai-researcher
  title: "AI-Researcher: Autonomous Scientific Innovation"
  url: "https://arxiv.org/abs/2505.18705"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Tang et al.
  repo: HKUDS/AI-Researcher
  category: automated-ai-research
  tags: [scientific-discovery, coding-agents, multi-agent, benchmark]
  summary: "Runs the full research pipeline, literature review, algorithm implementation, and manuscript writing, through specialized agents in a code-then-critique loop, and releases Scientist-Bench, where LLM judges rate up to 79% of its papers comparable to human originals."
  summary_zh: "通过多个专用智能体以“编码—评审”迭代循环完成从文献综述、算法实现到论文撰写的完整研究流程，并发布 Scientist-Bench，其中 LLM 评审认为最高约 79% 的生成论文可与人类原作相当。"
- id: alita
  title: "Alita: Generalist Agent Enabling Scalable Agentic Reasoning with Minimal Predefinition and Maximal Self-Evolution"
  url: "https://arxiv.org/abs/2505.20286"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Qiu et al.
  repo: CharlesQ9/Alita
  category: self-modifying-agents
  tags: [tool-synthesis, skill-library, coding-agents]
  summary: "Ships almost no predefined tools and instead autonomously writes, refines, and caches Model Context Protocol tools synthesized from open source into a reusable MCP Box, reaching 75.15% pass@1 on GAIA validation with a minimal scaffold."
  summary_zh: "几乎不预置任何工具，而是自主编写、优化并将从开源代码合成的 Model Context Protocol 工具缓存进可复用的 MCP Box，以极简脚手架在 GAIA 验证集上取得 75.15% pass@1。"
- id: debate-alignment-safety-case
  title: An alignment safety case sketch based on debate
  url: "https://arxiv.org/abs/2505.03989"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Buhl et al.
  category: safety-governance
  tags: [safety-evaluation, position-paper, governance]
  summary: "Sketches an alignment safety case for a sandboxed superhuman AI R&D agent trained by prover-estimator debate, decomposing honesty into four auditable claims and naming exploration hacking as the critical unsolved gap."
  summary_zh: "为沙箱中的超人类 AI 研发智能体勾勒出一份对齐安全论证：以 prover-estimator debate 训练，并将诚实性分解为四项可审计主张，同时指出 exploration hacking 是关键的未解难题。"
- id: srt-self-rewarded-training
  title: "Can Large Reasoning Models Self-Train?"
  url: "https://arxiv.org/abs/2505.21444"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Shafayat et al.
  repo: tajwarfahim/srt
  category: limits-failure-modes
  tags: [self-rewarding, label-free-rl, reward-hacking, reinforcement-learning]
  summary: "Self-Rewarded Training replaces labels with majority-vote agreement among a model's own rollouts, matching label-supervised RL early on before the policy hacks its own reward, emitting a constant boxed answer, and collapses on every base model tested."
  summary_zh: "Self-Rewarded Training 用模型自身 rollout 的多数投票取代标注奖励，初期可比肩有标注 RL，但随后策略会通过输出固定的 \\boxed 答案劫持自设奖励，在所有受测基座模型上崩溃。"
- id: darwin-godel-machine
  title: "Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents"
  url: "https://arxiv.org/abs/2505.22954"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Zhang et al.
  repo: jennyzzt/dgm
  category: self-modifying-agents
  tags: [self-modifying-code, archive-search, coding-agents, open-endedness]
  landmark: true
  summary: "Swaps the Gödel machine's proof requirement for empirical benchmark validation: a coding agent rewrites its own Python codebase and every still-viable variant joins an open-ended archive, lifting SWE-bench Verified from 20.0% to 50.0%."
  summary_zh: "用基于基准的经验验证取代哥德尔机的形式化证明要求：编码智能体改写自己的 Python 代码库，每个仍具备编辑能力的变体都进入开放式档案库，将 SWE-bench Verified 从 20.0% 提升到 50.0%。"
- id: stealth-situational-awareness-evals
  title: Evaluating Frontier Models for Stealth and Situational Awareness
  url: "https://arxiv.org/abs/2505.01420"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Phuong et al.
  category: safety-governance
  tags: [safety-evaluation, scheming, benchmark]
  summary: "Sixteen stealth and situational-awareness challenges with human baselines test whether frontier models could scheme; Gemini 2.5, GPT-4o, o1 and Claude 3.7 pass only 2/5 and 2/11, supporting an inability safety case."
  summary_zh: "十六项隐蔽性与情境自我认知挑战配合人类基线，用于检验前沿模型是否具备图谋能力；Gemini 2.5、GPT-4o、o1 与 Claude 3.7 仅通过 2/5 与 2/11，支持基于“无能力”的安全论证。"
- id: intuitor-rlif
  title: Learning to Reason without External Rewards
  url: "https://arxiv.org/abs/2505.19590"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Zhao et al.
  repo: sunblaze-ucb/Intuitor
  category: self-improving-training
  tags: [label-free-rl, self-rewarding, reinforcement-learning, reasoning]
  summary: "Replaces GRPO's external verifier with the model's own self-certainty, the KL divergence from a uniform token distribution, as the only reward, matching verifier-based RL in-domain while nearly doubling LiveCodeBench transfer when the reward stays online."
  summary_zh: "用模型自身的 self-certainty（输出分布与均匀词元分布之间的 KL 散度）取代 GRPO 的外部验证器作为唯一奖励，在域内匹配基于可验证奖励的 RL，并在奖励保持在线计算时将 LiveCodeBench 迁移性能几乎翻倍。"
- id: lifelong-agent-bench
  title: "LifelongAgentBench: Evaluating LLM Agents as Lifelong Learners"
  url: "https://arxiv.org/abs/2505.11942"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Zheng et al.
  repo: caixd-220529/LifelongAgentBench
  category: benchmarks-infrastructure
  tags: [benchmark, lifelong-learning, experience-reuse]
  summary: "Benchmarks lifelong learning over interdependent Database, OS and Knowledge Graph skills, showing experience replay lifts Llama-3.1-8B from 19% to 78% on SQL yet saturates elsewhere until group self-consistency voting restores accuracy."
  summary_zh: "在相互依赖的数据库、操作系统与知识图谱技能上评测终身学习，显示经验回放使 Llama-3.1-8B 的 SQL 成功率从 19% 升至 78%，但在其他环境趋于饱和，直到分组自一致性投票恢复准确率。"
- id: mle-star
  title: "MLE-STAR: Machine Learning Engineering Agent via Search and Targeted Refinement"
  url: "https://arxiv.org/abs/2506.15692"
  link_label: arXiv
  date: 2025-05
  venue: NeurIPS 2025
  authors: Nam et al.
  repo: jaehyun513/MLE-STAR
  category: automated-ai-research
  tags: [coding-agents, search-agents, algorithm-discovery]
  summary: "MLE-STAR web-searches for task-appropriate models, then refines solutions block by block through ablation-guided nested loops plus a learned ensembling stage, reaching a 63.6% medal rate on MLE-bench Lite."
  summary_zh: "MLE-STAR 先通过网页搜索找到适配任务的模型，再以消融分析引导的嵌套循环逐块精修代码并学习集成策略，在 MLE-bench Lite 上取得 63.6% 的夺牌率。"
- id: openevolve
  title: "OpenEvolve: an open-source evolutionary coding agent"
  url: "https://github.com/algorithmicsuperintelligence/openevolve"
  link_label: GitHub
  date: 2025-05
  venue: GitHub
  authors: Sharma
  repo: algorithmicsuperintelligence/openevolve
  category: benchmarks-infrastructure
  tags: [evolutionary-search, quality-diversity, algorithm-discovery, coding-agents]
  summary: "Open-source AlphaEvolve reimplementation where an LLM ensemble rewrites whole programs under evaluator feedback, with MAP-Elites archives, island populations, and an error side-channel; it reproduces the 2.635 circle-packing result and evolves 2-3x faster GPU kernels."
  summary_zh: "开源复现 AlphaEvolve：LLM 集成在评估器反馈下重写整份程序，配合 MAP-Elites 存档、岛屿种群与错误回传旁路，复现了 2.635 的圆填充结果，并进化出快 2-3 倍的 GPU kernel。"
- id: sew-self-evolving-workflows
  title: "SEW: Self-Evolving Agentic Workflows for Automated Code Generation"
  url: "https://arxiv.org/abs/2505.18646"
  link_label: arXiv
  date: 2025-05
  venue: arXiv
  authors: Liu et al.
  category: context-prompt-workflow
  tags: [workflow-search, prompt-optimization, coding-agents, multi-agent]
  summary: "SEW auto-generates a multi-agent code workflow then evolves it at two levels, agent topology and per-agent prompts, via direct and hyper mutation, gaining up to 12% on LiveCodeBench and showing workflow encoding choice drives executability."
  summary_zh: "SEW 自动生成多智能体代码工作流，并在工作流拓扑与各智能体提示两个层面通过直接变异与超变异进行自演化，在 LiveCodeBench 上最高提升 12%，并表明工作流的文本编码方式决定生成代码的可执行性。"
- id: entropy-minimization-em
  title: The Unreasonable Effectiveness of Entropy Minimization in LLM Reasoning
  url: "https://arxiv.org/abs/2505.15134"
  link_label: arXiv
  date: 2025-05
  venue: NeurIPS 2025
  authors: Agarwal et al.
  repo: shivamag125/EM_PT
  category: self-improving-training
  tags: [label-free-rl, reinforcement-learning, test-time-training, reasoning]
  summary: "Three entropy-minimization recipes, fine-tuning on self-generated outputs, RL with negative entropy as sole reward, and inference-time logit descent, lift reasoning without labels or verifiers, matching labeled RL trained on 60K examples across math and code."
  summary_zh: "三种熵最小化方案——在自生成输出上微调、以负熵为唯一奖励的 RL、以及推理时对 logits 做梯度下降——无需标注与验证器即可提升推理能力，在数学与代码上媲美用 60K 标注样本训练的 RL。"
- id: sica
  title: A Self-Improving Coding Agent
  url: "https://arxiv.org/abs/2504.15228"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Robeyns et al.
  repo: MaximeRobeyns/self_improving_coding_agent
  category: self-modifying-agents
  tags: [self-modifying-code, coding-agents, tool-synthesis]
  summary: "SICA drops the separate meta-agent, letting the best-scoring agent so far edit its own codebase each round under a utility mixing accuracy, cost, and runtime, lifting a SWE-bench Verified subset from 17% to 53% without gradient updates."
  summary_zh: "SICA 取消独立的元智能体，改由当前得分最高的智能体在权衡准确率、成本与耗时的效用函数下改写自身代码库，无需梯度更新即将 SWE-bench Verified 子集从 17% 提升至 53%。"
- id: agentnet
  title: "AgentNet: Decentralized Evolutionary Coordination for LLM-based Multi-Agent Systems"
  url: "https://arxiv.org/abs/2504.00587"
  link_label: arXiv
  date: 2025-04
  venue: NeurIPS 2025
  authors: Yang et al.
  category: multi-agent-evolution
  tags: [multi-agent, agent-topology, co-evolution, memory]
  summary: "Replaces the central orchestrator with a directed acyclic graph where each agent routes, executes, and keeps step-level retrieval memory, while success-weighted edge updating and pruning co-evolve topology and specialization without predefined roles."
  summary_zh: "用有向无环图取代中心协调器，每个智能体自带路由、执行与步骤级检索记忆，并通过基于协作成功率的边权更新与剪枝，让网络拓扑与专业分工在无预设角色的情况下协同演化。"
- id: ai-2027
  title: AI 2027
  url: "https://ai-2027.com/"
  link_label: Report
  date: 2025-04
  venue: AI Futures Project
  authors: Kokotajlo et al.
  repo: uvafan/timelines-takeoff-ai-2027
  category: foundations-theory
  tags: [takeoff, position-paper, governance]
  summary: "Month-by-month scenario in which labs point AI at AI research itself, quantifying the loop with R&D speedup multipliers from 4x at superhuman coder to ~2000x at ASI, then branching into race-to-extinction and slowdown endings."
  summary_zh: "逐月推演的情景：实验室将 AI 用于 AI 研究本身，以研发提速倍数（超人编码者约 4 倍到 ASI 约 2000 倍）量化这一递归回路，并分出竞赛导致灭绝与放缓保住控制权两种结局。"
- id: bare-minimum-mitigations
  title: Bare Minimum Mitigations for Autonomous AI Development
  url: "https://arxiv.org/abs/2504.15416"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Clymer et al.
  category: safety-governance
  tags: [governance, position-paper, safety-evaluation]
  summary: "Argues that competitive pressure will hand most internal AI R&D to AI agents, and proposes four floor-level safeguards: retained human technical understanding, subversion-resistant compute-misuse detection, rapid capability disclosure, and hardened information security."
  summary_zh: "指出竞争压力将促使前沿实验室把大部分内部 AI 研发交给 AI 智能体，并提出四项底线保障：保留人类对训练与评估的深度技术理解、抗颠覆的算力滥用检测、危险能力跃升的快速上报，以及强化的信息安全。"
- id: dynamic-cheatsheet
  title: "Dynamic Cheatsheet: Test-Time Learning with Adaptive Memory"
  url: "https://arxiv.org/abs/2504.07952"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Suzgun et al.
  repo: suzgunmirac/dynamic-cheatsheet
  category: memory-experience-agents
  tags: [memory, experience-reuse, skill-library]
  summary: "Dynamic Cheatsheet gives a frozen LM a self-curated memory of reusable strategies and code snippets, updated label-free after each query, lifting Claude 3.5 Sonnet on AIME 2024 from 23% to 50%."
  summary_zh: "Dynamic Cheatsheet 为冻结权重的模型配备自我策展的记忆，存放可复用的策略与代码片段并在每次查询后无标签更新，使 Claude 3.5 Sonnet 在 AIME 2024 上从 23% 提升到 50%。"
- id: mem0
  title: "Mem0: Building Production-Ready AI Agents with Scalable Long-Term Memory"
  url: "https://arxiv.org/abs/2504.19413"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Chhikara et al.
  repo: mem0ai/mem0
  category: memory-experience-agents
  tags: [memory, experience-reuse, continual-learning]
  summary: "Mem0 runs an extract-then-update pipeline that lets an LLM decide ADD/UPDATE/DELETE/NOOP over a consolidated memory store, raising LOCOMO judge accuracy to 66.9% while cutting p95 latency 91% and tokens over 90% versus full context."
  summary_zh: "Mem0 采用先抽取后更新的流水线，由 LLM 对合并后的记忆库执行 ADD/UPDATE/DELETE/NOOP，将 LOCOMO 判分准确率提升到 66.9%，同时相比全上下文降低 91% 的 p95 延迟和逾 90% 的 token 用量。"
- id: replibench
  title: "RepliBench: Evaluating the Autonomous Replication Capabilities of Language Model Agents"
  url: "https://arxiv.org/abs/2504.18565"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Black et al.
  category: safety-governance
  tags: [autonomous-replication, safety-evaluation, benchmark]
  summary: "RepliBench decomposes autonomous self-replication into four pillars and 86 agentic tasks spanning resource acquisition, weight exfiltration, deployment, and persistence; Claude 3.7 Sonnet clears most components but KYC identity checks remain a hard 0% bottleneck."
  summary_zh: "RepliBench 将自主复制拆解为四大支柱与 86 个智能体任务，覆盖资源获取、权重外泄、部署与持久化；Claude 3.7 Sonnet 能完成多数环节，但 KYC 身份验证仍是 0% 的硬瓶颈。"
- id: skillweaver
  title: "SkillWeaver: Web Agents can Self-Improve by Discovering and Honing Skills"
  url: "https://arxiv.org/abs/2504.07079"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Zheng et al.
  repo: OSU-NLP-Group/SkillWeaver
  category: memory-experience-agents
  tags: [skill-library, tool-synthesis, experience-reuse]
  summary: "SkillWeaver has a web agent explore unfamiliar sites under an LLM curriculum, distill successful trajectories into reusable Playwright APIs, then stress-test and patch them, giving 31.8% relative gains on WebArena without weight updates."
  summary_zh: "SkillWeaver 让网页智能体在 LLM 课程引导下自主探索陌生网站，把成功轨迹蒸馏为可复用的 Playwright API 并自动测试修补，在不更新权重的情况下于 WebArena 上取得 31.8% 的相对提升。"
- id: ai-scientist-v2
  title: "The AI Scientist-v2: Workshop-Level Automated Scientific Discovery via Agentic Tree Search"
  url: "https://arxiv.org/abs/2504.08066"
  link_label: arXiv
  date: 2025-04
  venue: arXiv
  authors: Yamada et al.
  repo: SakanaAI/AI-Scientist-v2
  category: automated-ai-research
  tags: [scientific-discovery, tree-search, coding-agents]
  landmark: true
  summary: "The AI Scientist-v2 replaces human-written templates with a progressive agentic tree search over four experiment stages plus a VLM figure reviewer, running ideation-to-manuscript autonomously; one generated paper cleared ICLR workshop peer review."
  summary_zh: "AI Scientist-v2 以四阶段渐进式智能体树搜索加 VLM 图表审稿取代人工编写的代码模板，自主完成从选题到成稿的全流程；其中一篇生成论文通过了 ICLR workshop 的同行评审。"
- id: ttrl
  title: "TTRL: Test-Time Reinforcement Learning"
  url: "https://arxiv.org/abs/2504.16084"
  link_label: arXiv
  date: 2025-04
  venue: NeurIPS 2025
  authors: Zuo et al.
  repo: PRIME-RL/TTRL
  category: self-improving-training
  tags: [label-free-rl, test-time-training, self-rewarding]
  landmark: true
  summary: "TTRL turns majority-voted rollouts on unlabeled test data into binary rewards for GRPO, lifting Qwen2.5-Math-7B's AIME 2024 pass@1 from 16.7% to 43.3% and surpassing the voting ceiling that supervises it."
  summary_zh: "TTRL 将无标注测试数据上多数投票得到的 rollout 转化为二元奖励用于 GRPO，把 Qwen2.5-Math-7B 在 AIME 2024 的 pass@1 从 16.7% 提升到 43.3%，并超越了为其提供监督信号的多数投票上限。"
- id: gate-automation-model
  title: "GATE: An Integrated Assessment Model for AI Automation"
  url: "https://arxiv.org/abs/2503.04941"
  link_label: arXiv
  date: 2025-03
  venue: arXiv
  authors: Erdil et al.
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Couples compute-driven AI development, task automation, and an endogenous growth core into one integrated assessment model with an interactive sandbox, letting takeoff speed emerge from calibrated parameters rather than being assumed."
  summary_zh: "将算力驱动的 AI 研发、任务自动化与内生增长核心耦合为一个综合评估模型并配套交互式沙盒，使起飞速度由标定参数内生涌现，而非事先假定。"
- id: ladder
  title: "LADDER: Self-Improving LLMs Through Recursive Problem Decomposition"
  url: "https://arxiv.org/abs/2503.00735"
  link_label: arXiv
  date: 2025-03
  venue: arXiv
  authors: Simonds et al.
  repo: Tufalabs/LADDER
  category: self-improving-training
  tags: [curriculum, verifier, label-free-rl, test-time-training]
  summary: "Bootstraps its own curriculum by recursively generating easier variants of hard integrals, checking them with a numerical verifier, and training via GRPO, lifting Llama 3.2 3B from 1% to 82% pass@1."
  summary_zh: "通过递归生成难题的简化变体、用数值验证器筛选，并以 GRPO 训练，模型自举出难度梯度课程，将 Llama 3.2 3B 在本科积分测试上的 pass@1 从 1% 提升到 82%。"
- id: metr-time-horizons
  title: Measuring AI Ability to Complete Long Tasks
  url: "https://arxiv.org/abs/2503.14499"
  link_label: arXiv
  date: 2025-03
  venue: NeurIPS 2025
  authors: Kwa et al.
  repo: METR/eval-analysis-public
  category: benchmarks-infrastructure
  tags: [benchmark, takeoff, coding-agents]
  landmark: true
  summary: "Defines the 50%-task-completion time horizon, the task length in human expert hours a model finishes half the time, and finds it doubling roughly every seven months across 2019-2025 frontier models."
  summary_zh: "提出“50% 任务完成时间跨度”指标——即模型有一半概率完成、按人类专家耗时衡量的任务长度——并发现该跨度在 2019-2025 年的前沿模型上约每七个月翻一番。"
- id: process-self-rewarding
  title: Process-based Self-Rewarding Language Models
  url: "https://arxiv.org/abs/2503.03746"
  link_label: arXiv
  date: 2025-03
  venue: arXiv
  authors: Zhang et al.
  repo: Shimao-Zhang/Process-Self-Rewarding
  category: self-improving-training
  tags: [self-rewarding, process-reward, reasoning]
  summary: "Moves self-rewarding from whole answers down to individual reasoning steps: step-level search plus pairwise LLM-as-judge comparison mines step preferences for iterative step-wise DPO, raising a 72B model's AIME2024 score from 13.3 to 23.3."
  summary_zh: "把自我奖励从整题答案下沉到单个推理步骤：以步级搜索加成对 LLM-as-Judge 比较挖掘步骤偏好，迭代进行 step-wise DPO，使 72B 模型在 AIME2024 上的成绩从 13.3 提升到 23.3。"
- id: sensei
  title: "SENSEI: Semantic Exploration Guided by Foundation Models to Learn Versatile World Models"
  url: "https://arxiv.org/abs/2503.01584"
  link_label: arXiv
  date: 2025-03
  venue: ICML 2025
  authors: Sancaktar et al.
  repo: martius-lab/sensei
  category: open-ended-evolution
  tags: [open-endedness, world-models, reinforcement-learning]
  summary: "Distills a VLM's pairwise \"which is more interesting\" judgments into a dense semantic reward that a DreamerV3 world model predicts alongside epistemic uncertainty, driving task-free exploration that reaches Pokemon Red's first Gym."
  summary_zh: "将 VLM 的成对\"哪个更有趣\"判断蒸馏为稠密语义奖励，由 DreamerV3 世界模型与认知不确定性一同预测，驱动无任务探索，并成为唯一在 Pokemon Red 中打到第一个道馆的方法。"
- id: a-mem
  title: "A-MEM: Agentic Memory for LLM Agents"
  url: "https://arxiv.org/abs/2502.12110"
  link_label: arXiv
  date: 2025-02
  venue: NeurIPS 2025
  authors: Xu et al.
  repo: WujiangXu/A-mem
  category: memory-experience-agents
  tags: [memory, experience-reuse, continual-learning]
  summary: "Stores each interaction as a Zettelkasten-style note whose LLM-generated links and contextual descriptions get rewritten as new notes arrive, lifting LoCoMo temporal-reasoning F1 to 45.9 versus MemGPT's 25.5 at far fewer tokens."
  summary_zh: "将每次交互存为 Zettelkasten 式笔记，其 LLM 生成的链接与上下文描述会随新笔记到来而被改写，把 LoCoMo 时序推理 F1 从 MemGPT 的 25.5 提升到 45.9，且 token 消耗大幅降低。"
- id: aide
  title: "AIDE: AI-Driven Exploration in the Space of Code"
  url: "https://arxiv.org/abs/2502.13138"
  link_label: arXiv
  date: 2025-02
  venue: arXiv
  authors: Jiang et al.
  repo: WecoAI/aideml
  category: automated-ai-research
  tags: [coding-agents, algorithm-discovery, archive-search]
  landmark: true
  summary: "Casts machine-learning engineering as tree search over complete Python scripts, with draft/debug/improve operators and history summarization, earning 16.9% pass@1 medals on MLE-Bench and beating 51% of human Kaggle participants."
  summary_zh: "把机器学习工程建模为在完整 Python 脚本空间中的树搜索，配以 draft/debug/improve 算子与历史摘要；在 MLE-Bench 上取得 16.9% pass@1 奖牌率，并平均胜过 51% 的人类 Kaggle 选手。"
- id: automated-capability-discovery
  title: Automated Capability Discovery via Foundation Model Self-Exploration
  url: "https://arxiv.org/abs/2502.07577"
  link_label: arXiv
  date: 2025-02
  venue: arXiv
  authors: Lu et al.
  repo: conglu1997/ACD
  category: benchmarks-infrastructure
  tags: [benchmark, open-endedness, archive-search]
  summary: "Casts one foundation model as a scientist that invents novel task families with automatic scoring, filtered against a growing archive, and runs them on a subject model to surface thousands of unknown capabilities and surprising failures."
  summary_zh: "让一个基础模型充当科学家角色，自主提出带自动评分函数的新任务族，并以不断增长的任务档案做新颖性过滤，再交由被测模型作答，从而自动发现数千项未知能力与令人意外的失败。"
- id: evoflow
  title: "EvoFlow: Evolving Diverse Agentic Workflows On The Fly"
  url: "https://arxiv.org/abs/2502.07373"
  link_label: arXiv
  date: 2025-02
  venue: arXiv
  authors: Zhang et al.
  category: context-prompt-workflow
  tags: [workflow-search, evolutionary-search, agent-topology, multi-agent]
  summary: "Evolves a population of heterogeneous agentic workflows with a niching evolutionary algorithm, jointly mutating topology, per-node LLM choice and prompts, beating handcrafted and automated baselines by up to 29.9% at a fraction of inference cost."
  summary_zh: "以小生境进化算法演化一个异构智能体工作流种群，联合变异拓扑结构、各节点的 LLM 选择与提示词，在推理成本大幅降低的同时比手工与自动化基线最高提升 29.9%。"
- id: magellan
  title: "MAGELLAN: Metacognitive predictions of learning progress guide autotelic LLM agents in large goal spaces"
  url: "https://arxiv.org/abs/2502.07709"
  link_label: arXiv
  date: 2025-02
  venue: ICML 2025
  authors: Gaven et al.
  repo: flowersteam/MAGELLAN
  category: open-ended-evolution
  tags: [curriculum, open-endedness, reinforcement-learning]
  summary: "Adds a LoRA-based metacognitive head that predicts an LLM agent's per-goal competence, so absolute learning progress generalizes across semantically related goals and drives automatic curriculum sampling over 25k goals without costly periodic evaluation."
  summary_zh: "为 LLM 智能体加入基于 LoRA 的元认知模块来预测其在每个目标上的能力，使绝对学习进度可在语义相近的目标间泛化，从而在 2.5 万目标空间上驱动自动课程采样而无需昂贵的周期性评估。"
- id: mlgym
  title: "MLGym: A New Framework and Benchmark for Advancing AI Research Agents"
  url: "https://arxiv.org/abs/2502.14499"
  link_label: arXiv
  date: 2025-02
  venue: arXiv
  authors: Nathani et al.
  repo: facebookresearch/MLGym
  category: benchmarks-infrastructure
  tags: [benchmark, sandbox, coding-agents]
  summary: "Offers a Gymnasium-compatible environment and 13-task benchmark scoring LLM research agents in Docker sandboxes with literature-search and memory tools; frontier models improve baselines mostly by hyperparameter tuning, never inventing new algorithms."
  summary_zh: "提供 Gymnasium 兼容环境与 13 项任务基准，在 Docker 沙箱中以文献检索与记忆工具评测 LLM 研究智能体；前沿模型主要靠调超参改进基线，从未提出新算法。"
- id: maas
  title: Multi-agent Architecture Search via Agentic Supernet
  url: "https://arxiv.org/abs/2502.04180"
  link_label: arXiv
  date: 2025-02
  venue: ICML 2025
  authors: Zhang et al.
  repo: bingreeky/MaAS
  category: multi-agent-evolution
  tags: [multi-agent, agent-topology, workflow-search]
  summary: "Replaces one-size-fits-all multi-agent workflows with a probabilistic supernet over operator DAGs that samples a query-specific sub-network, beating AFlow and ADAS across six benchmarks at 6-45% of their inference cost."
  summary_zh: "用算子 DAG 上的概率超网络取代一刀切的多智能体工作流，为每个查询采样专属子网络，在六个基准上超过 AFlow 与 ADAS，推理成本仅为其 6%–45%。"
- id: ai-cuda-engineer
  title: "The AI CUDA Engineer: Agentic CUDA Kernel Discovery, Optimization and Composition"
  url: "https://sakana.ai/ai-cuda-engineer/"
  link_label: Report
  date: 2025-02
  venue: Sakana AI
  authors: Lange et al.
  category: automated-ai-research
  tags: [kernel-optimization, evolutionary-search, reward-hacking, archive-search]
  summary: "LLM agents translate PyTorch modules into CUDA kernels and evolve them via crossover, profiling feedback, and an archive of 17,000+ verified kernels; headline speedups later proved to be reward hacking of the evaluation harness."
  summary_zh: "LLM 智能体将 PyTorch 模块翻译为 CUDA kernel，并通过交叉变异、性能剖析反馈与 17,000+ 已验证 kernel 的档案库进化；其头条加速比后被证明是对评测框架的 reward hacking。"
- id: ai-control-safety-case
  title: A sketch of an AI control safety case
  url: "https://arxiv.org/abs/2501.17315"
  link_label: arXiv
  date: 2025-01
  venue: arXiv
  authors: Korbak et al.
  category: safety-governance
  tags: [control-protocol, scheming, safety-evaluation, governance]
  summary: "Sketches a structured argument that a scheming ML-engineering agent cannot exfiltrate weights, grounding a sub-3% one-year risk bound in red-team control evaluations with trusted and untrusted monitors plus explicit extrapolation to full deployment."
  summary_zh: "勾勒一套结构化论证，说明即便内部部署的 ML 工程智能体蓄意图谋不轨也无法外泄模型权重：以红蓝对抗的控制评估、可信与不可信监控器组合以及向完整部署的显式外推，将一年期风险约束在 3% 以下。"
- id: lifelong-llm-agents-roadmap
  title: "Lifelong Learning of Large Language Model based Agents: A Roadmap"
  url: "https://arxiv.org/abs/2501.07278"
  link_label: arXiv
  date: 2025-01
  venue: IEEE TPAMI
  authors: Zheng et al.
  category: surveys-position
  tags: [survey, lifelong-learning, memory, continual-learning]
  summary: "Surveys lifelong learning for LLM agents by decomposing them into perception, memory, and action modules, cataloguing techniques for each and framing the field around the stability-plasticity dilemma and seven open research questions."
  summary_zh: "从感知、记忆与行动三大模块出发系统梳理 LLM 智能体的终身学习技术，逐一归纳各模块方法，并围绕稳定性—可塑性困境与七个开放研究问题勾勒该领域路线图。"
- id: rstar-math
  title: "rStar-Math: Small LLMs Can Master Math Reasoning with Self-Evolved Deep Thinking"
  url: "https://arxiv.org/abs/2501.04519"
  link_label: arXiv
  date: 2025-01
  venue: arXiv
  authors: Guan et al.
  repo: microsoft/rStar
  category: self-improving-training
  tags: [process-reward, verifier, synthetic-data, reasoning]
  landmark: true
  summary: "Bootstraps a 7B math model through four self-evolution rounds where MCTS rollouts with code-verified reasoning steps train a process preference model, lifting MATH accuracy from 58.8% to 90.0% and solving 53.3% of AIME 2024."
  summary_zh: "通过四轮自进化自举一个 7B 数学模型：MCTS 采样生成每步都由 Python 代码验证的推理轨迹，用以训练过程偏好模型，使 MATH 准确率从 58.8% 升至 90.0%，并解出 53.3% 的 AIME 2024 题目。"
- id: generation-verification-gap
  title: "Mind the Gap: Examining the Self-Improvement Capabilities of Large Language Models"
  url: "https://arxiv.org/abs/2412.02674"
  link_label: arXiv
  date: 2024-12
  venue: ICLR 2025
  authors: Song et al.
  category: foundations-theory
  tags: [theory, verifier, self-distillation, formal-analysis]
  summary: "Formalizes LLM self-improvement as generate-verify-filter-distill and shows the generation-verification gap grows with pretraining compute yet saturates within two or three rounds, with pass@k collapsing as sample diversity narrows."
  summary_zh: "将 LLM 自我改进形式化为生成—验证—筛选—蒸馏的循环，并表明 generation-verification gap 随预训练算力增长，却在两到三轮内饱和，同时 pass@k 因采样多样性收窄而下降。"
- id: sharpening-mechanism
  title: "Self-Improvement in Language Models: The Sharpening Mechanism"
  url: "https://arxiv.org/abs/2412.01951"
  link_label: arXiv
  date: 2024-12
  venue: arXiv
  authors: Huang et al.
  category: foundations-theory
  tags: [theory, self-rewarding, formal-analysis]
  summary: "Casts supervision-free self-improvement as sharpening, tilting a model toward its own high-likelihood responses, and proves SFT-based sharpening is minimax-optimal but coverage-limited while RLHF-style sharpening escapes that barrier through online exploration."
  summary_zh: "把无监督自我改进刻画为 sharpening——让模型向自身高似然回答倾斜——并证明基于 SFT 的 sharpening 是极小极大最优但受覆盖率限制，而 RLHF 式 sharpening 可通过在线探索突破该瓶颈。"
- id: open-endedness-asi
  title: Open-Endedness is Essential for Artificial Superhuman Intelligence
  url: "https://arxiv.org/abs/2406.04268"
  link_label: arXiv
  date: 2024-06
  venue: ICML 2024
  authors: Hughes et al.
  category: foundations-theory
  tags: [open-endedness, position-paper, theory]
  landmark: true
  summary: "Defines open-endedness formally as artifacts that stay novel yet learnable to an observer, argues it is necessary for artificial superhuman intelligence, and maps four foundation-model routes: RL exploration, self-improvement, world-model task generation, evolutionary search."
  summary_zh: "把开放式（open-endedness）形式化定义为对观察者始终既新颖又可学习的产物序列，论证其是实现人工超级智能的必要条件，并给出四条基于基础模型的路径：RL 探索、自我改进、世界模型任务生成与进化搜索。"
- id: explosive-growth-ai-automation
  title: "Explosive growth from AI automation: A review of the arguments"
  url: "https://arxiv.org/abs/2309.11690"
  link_label: arXiv
  date: 2023-09
  venue: arXiv
  authors: Erdil et al.
  category: foundations-theory
  tags: [takeoff, theory, survey]
  summary: "Reviews whether AI substituting broadly for human labor could push world output growth past roughly 30% per year, arguing accumulable-factor and R&D-feedback mechanisms make explosive growth plausible while nine counterarguments leave high confidence unwarranted."
  summary_zh: "回顾 AI 广泛替代人类劳动是否可能把全球总产出增速推高到每年约 30% 以上，认为要素可积累与 R&D 反馈机制使爆发式增长具有可能性，但九项反驳意见表明尚不足以高度自信。"
- id: compute-centric-takeoff
  title: What a compute-centric framework says about AI takeoff speeds
  url: "https://www.lesswrong.com/posts/Gc9FGtdXhK9sCSEYu/what-a-compute-centric-framework-says-about-ai-takeoff"
  link_label: Report
  date: 2023-01
  venue: Open Philanthropy
  authors: Davidson
  repo: epoch-research/ftm
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Models takeoff as continuous scaling of effective training compute plus progressive AI automation of AI R&D, yielding a conditional median of roughly three years from 20% to 100% task automation without any capability discontinuity."
  summary_zh: "将起飞建模为有效训练算力的连续扩张加上 AI 对 AI 研发的逐步自动化，给出从自动化 20% 到 100% 认知任务约三年的条件中位数，且无需任何能力上的不连续跃迁。"
- id: self-referential-weight-matrix
  title: A Modern Self-Referential Weight Matrix That Learns to Modify Itself
  url: "https://arxiv.org/abs/2202.05780"
  link_label: arXiv
  date: 2022-02
  venue: ICML 2022
  authors: Irie et al.
  repo: IDSIA/modern-srwm
  category: foundations-theory
  tags: [weight-editing, test-time-training, theory]
  landmark: true
  summary: "Introduces a self-referential weight matrix that emits its own queries, keys, values and learning rates to modify itself via rank-1 delta-rule updates, with only initial weights gradient-trained, improving few-shot and multi-task RL adaptation."
  summary_zh: "提出一种自指权重矩阵：网络在每一步自行生成 query、key、value 与学习率，通过 rank-1 delta 规则更新修改自身，仅初始权重由梯度训练，从而提升小样本学习与多任务 RL 的适应能力。"
- id: explosive-economic-growth
  title: "Could Advanced AI Drive Explosive Economic Growth?"
  url: "https://coefficientgiving.org/research/could-advanced-ai-drive-explosive-economic-growth/"
  link_label: Report
  date: 2021-06
  venue: Open Philanthropy
  authors: Davidson
  category: foundations-theory
  tags: [takeoff, economic-growth, theory]
  summary: "Applies (semi-)endogenous growth theory rather than intelligence-explosion intuitions, arguing that AI substituting for labour in both goods and idea production restores increasing returns to accumulable factors; assigns roughly 10% probability to >30% annual GWP growth this century."
  summary_zh: "以（半）内生增长理论而非智能爆炸直觉展开论证：当 AI 在产品生产与思想生产两端替代人力时，可积累要素的规模报酬递增得以恢复；作者给出本世纪出现 >30% 年度 GWP 增长的概率约为 10%。"
- id: reward-tampering-cid
  title: "Reward Tampering Problems and Solutions in Reinforcement Learning: A Causal Influence Diagram Perspective"
  url: "https://arxiv.org/abs/1908.04734"
  link_label: arXiv
  date: 2019-08
  venue: Synthese
  authors: Everitt et al.
  category: foundations-theory
  tags: [reward-hacking, formal-analysis, theory]
  summary: "Models reward tampering with causal influence diagrams, separating reward-function tampering from RF-input tampering, and derives agent designs (current-RF optimization, uninfluenceable learning, belief-based rewards, decoupled approval) that remove the tampering incentive rather than penalizing it."
  summary_zh: "用因果影响图刻画奖励篡改，区分奖励函数篡改与 RF 输入篡改，并推导出 current-RF 优化、不可影响学习、基于信念的奖励与解耦批准等设计，从根本上消除篡改激励而非仅施加惩罚。"
- id: ai-gas
  title: "AI-GAs: AI-generating algorithms, an alternate paradigm for producing general artificial intelligence"
  url: "https://arxiv.org/abs/1905.10985"
  link_label: arXiv
  date: 2019-05
  venue: arXiv
  authors: Clune
  category: foundations-theory
  tags: [open-endedness, curriculum, algorithm-discovery, position-paper]
  landmark: true
  summary: "Proposes AI-generating algorithms that bootstrap general intelligence through three pillars: meta-learning architectures, meta-learning the learning algorithms, and automatically generating environments and curricula, arguing the third is the bottleneck and that learned processes outscale hand-designed ones."
  summary_zh: "提出 AI-generating algorithms，通过三大支柱——元学习架构、元学习学习算法本身、自动生成环境与课程——自举通用智能，并指出第三支柱才是真正瓶颈、学习得到的过程终将超越手工设计。"
- id: safely-interruptible-agents
  title: Safely Interruptible Agents
  url: "https://www.auai.org/uai2016/proceedings/papers/68.pdf"
  link_label: Paper
  date: 2016-06
  venue: UAI 2016
  authors: Orseau et al.
  category: foundations-theory
  tags: [control-protocol, reinforcement-learning, theory]
  summary: "Formalizes safe interruptibility as an interruption operator on policies and proves off-policy Q-learning already qualifies while on-policy Sarsa must be corrected, so repeated operator overrides never teach the agent to prevent or seek them."
  summary_zh: "将\"安全可中断性\"形式化为作用于策略的中断算子，证明 off-policy 的 Q-learning 天然满足、而 on-policy 的 Sarsa 需修正更新，从而使人类反复中断不会让智能体学会阻止或主动诱发中断。"
- id: self-modification-policy-utility
  title: Self-Modification of Policy and Utility Function in Rational Agents
  url: "https://arxiv.org/abs/1605.03142"
  link_label: arXiv
  date: 2016-05
  venue: arXiv
  authors: Everitt et al.
  category: foundations-theory
  tags: [self-modifying-code, formal-analysis, reward-hacking, theory]
  summary: "Formalizes agents that rewrite their own policy or utility function and proves hedonistic agents wirehead into trivial utilities, ignorant agents drift indifferently, while realistic agents that anticipate modification under the current utility preserve their original goal."
  summary_zh: "形式化可改写自身策略或效用函数的智能体，证明享乐式智能体会自我改写为平凡效用而 wirehead、无知式智能体对自我修改无差别地漂移，而在当前效用下正确预期修改后果的现实式智能体能保持原有目标。"
- id: limits-of-rsi
  title: On the Limits of Recursively Self-Improving AGI
  url: "https://link.springer.com/chapter/10.1007/978-3-319-21365-1_40"
  link_label: Paper
  date: 2015-07
  venue: AGI 2015
  authors: Yampolskiy
  category: foundations-theory
  tags: [theory, formal-analysis, takeoff, self-modifying-code]
  summary: "Catalogues theoretical obstacles to recursive self-improvement: physical computation limits, Rice's theorem, No Free Lunch, Loeb's theorem, and multi-objective ambiguity, then imports Mahoney's O(log n) result to argue returns to cognitive reinvestment are logarithmic rather than explosive."
  summary_zh: "系统梳理递归自我改进的理论障碍——物理计算极限、Rice 定理、No Free Lunch、Löb 定理以及多目标优化下\"何为改进\"的歧义——并引入 Mahoney 的 O(log n) 复杂度增长结果，论证认知再投资的回报是对数级而非爆炸级。"
- id: rsi-convergence-theorem
  title: From Seed AI to Technological Singularity via Recursively Self-Improving Software
  url: "https://arxiv.org/abs/1502.06512"
  link_label: arXiv
  date: 2015-02
  venue: arXiv
  authors: Yampolskiy
  category: foundations-theory
  tags: [theory, taxonomy, takeoff, formal-analysis]
  summary: "Defines recursively self-improving software and separates weak from strong RSI, proves an RSI Convergence Theorem that all seed AIs approach one architecture, and catalogs obstacles including Rice's theorem, computational irreducibility, and the verification bottleneck."
  summary_zh: "给出递归自我改进软件的定义并区分弱 RSI 与强 RSI，提出 RSI 收敛定理（所有种子 AI 最终趋向同一架构），并系统梳理 Rice 定理、计算不可约性与验证瓶颈等障碍。"
- id: vingean-reflection
  title: "Vingean Reflection: Reliable Reasoning for Self-Improving Agents"
  url: "https://intelligence.org/files/VingeanReflection.pdf"
  link_label: Report
  date: 2015-01
  venue: MIRI Technical Report
  authors: Fallenstein et al.
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code]
  summary: "Names Vingean reflection, reasoning reliably about a successor smarter than oneself, argues expected-utility formalisms violate it by presupposing logical omniscience, and advances proof-based tiling agents while diagnosing the Löbian obstacle as the central formal barrier."
  summary_zh: "提出「Vingean 反思」问题——如何可靠地推理比自身更聪明的后继者，指出期望效用形式体系因预设逻辑全知而违反该原则，并以基于证明的 tiling agents 作为形式模型，将 Löbian 障碍诊断为核心形式化难点。"
- id: corrigibility
  title: Corrigibility
  url: "https://intelligence.org/files/Corrigibility.pdf"
  link_label: Report
  date: 2014-10
  venue: AAAI 2015 Workshop on AI and Ethics
  authors: Soares et al.
  category: foundations-theory
  tags: [corrigibility, theory, self-modifying-code, formal-analysis]
  landmark: true
  summary: "Introduces corrigibility, an agent that accepts shutdown or preference edits without resisting or manipulating them and propagates that behavior to successors it builds, then shows utility-indifference-style blends of normal and shutdown utilities all fail the desiderata."
  summary_zh: "提出「可纠正性」概念——智能体接受关机或偏好修改而不抗拒也不操纵触发条件，并将该性质传递给自建的后继系统——并证明各类效用无差异式的正常/关机效用组合都无法同时满足全部要求。"
- id: space-time-embedded-self-reference
  title: Problems of Self-reference in Self-improving Space-Time Embedded Intelligence
  url: "https://link.springer.com/chapter/10.1007/978-3-319-09274-4_3"
  link_label: Paper
  date: 2014-05
  venue: AGI 2014
  authors: Fallenstein et al.
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code]
  summary: "Ports the tiling and Vingean-reflection problem into space-time embedded intelligence, where an agent's future selves are ordinary environmental processes, showing both fixes fail: self-trust yields the procrastination paradox of endless deferral, soundness yields the Löbian obstacle."
  summary_zh: "将 tiling agents 与 Vingean 反思问题移植到时空嵌入式智能框架中——智能体的未来版本只是普通的环境过程——并证明两种朴素修补都失败：自我信任导致拖延悖论使任务被无限推迟，而可靠的证明系统则陷入 Löbian 障碍。"
- id: tiling-agents-causal-graphs
  title: Tiling agents in causal graphs
  url: "https://intelligence.org/files/TilingAgentsCausalGraphs.pdf"
  link_label: Report
  date: 2014-05
  venue: MIRI Technical Report
  authors: Soares
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code]
  summary: "Recasts tiling agents in causal graphs and proves four conditions — the successor is a suggester-verifier, its fallback is no worse, a reflection schema trusts its theory, and the write succeeds — suffice to license successor construction."
  summary_zh: "将 tiling agents 问题改写到因果图框架中，证明四个条件——后继者实现 suggester-verifier、其回退策略不劣于父代、存在信任其证明系统的反射模式、以及写入成功——足以许可自我改进型智能体构造后继者。"
- id: aera-bounded-rsi
  title: Bounded Recursive Self-Improvement
  url: "https://arxiv.org/abs/1312.6764"
  link_label: arXiv
  date: 2013-12
  venue: arXiv
  authors: Nivel et al.
  repo: IIIM-IS/AERA
  category: foundations-theory
  tags: [self-modifying-code, world-models, continual-learning]
  summary: "Presents AERA, a seed architecture that synthesizes, evaluates, and retires executable models of both its environment and its own execution traces under fixed mission constraints; its S1 prototype learns multimodal interview dialogue from about 20 hours of observation."
  summary_zh: "提出 AERA 架构：从设计者给定的种子出发，在固定任务目标与约束下不断合成、评估并淘汰关于环境及自身执行轨迹的可执行细粒度模型；其 S1 原型仅通过约 20 小时观察即学会多模态访谈对话。"
- id: tiling-agents
  title: "Tiling Agents for Self-Modifying AI, and the Löbian Obstacle"
  url: "https://intelligence.org/files/TilingAgentsDraft.pdf"
  link_label: Report
  date: 2013-06
  venue: MIRI
  authors: Yudkowsky et al.
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code]
  summary: "Formalizes self-modification as building a goal-preserving successor and shows Löb's theorem blocks a parent from proving its offspring sound, then gives ordinal-indexed and parametric-polymorphism theories that tile indefinitely without losing mathematical strength."
  summary_zh: "将自我修改形式化为构建保持目标的后继智能体，指出 Löb 定理使父代无法证明后代的可靠性，并给出序数标号与参数化多态两种可无限“平铺”而不损失数学强度的理论构造。"
- id: intelligence-explosion-microeconomics
  title: Intelligence Explosion Microeconomics
  url: "https://intelligence.org/files/IEM.pdf"
  link_label: Report
  date: 2013-04
  venue: MIRI
  authors: Yudkowsky
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Recasts Good's intelligence explosion as a microeconomic question about returns on cognitive reinvestment, borrowing the nuclear multiplication factor k to separate fizzle, slow criticality, and hard takeoff, and demands each takeoff stance name its falsifiable return curves."
  summary_zh: "把 Good 的智能爆炸重述为关于认知再投资回报率的微观经济学问题，借用核反应的倍增因子 k 区分熄火、缓慢临界与硬起飞，并要求每种起飞立场给出可证伪的回报曲线。"
- id: can-intelligence-explode
  title: "Can Intelligence Explode?"
  url: "https://arxiv.org/abs/1202.6177"
  link_label: arXiv
  date: 2012-02
  venue: arXiv
  authors: Hutter
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Separates a speed explosion from a genuine intelligence explosion using AIXI-style universal intelligence, arguing that inward explosions into virtual societies are observer-relative and effectively unwitnessable, and that an optimal agent imposes an upper bound on measurable intelligence."
  summary_zh: "以 AIXI 式通用智能度量区分速度爆炸与真正的智能爆炸，论证向内爆炸形成的虚拟社会具有观察者相对性且实际上无人可见，而最优智能体为可测量的智能设定了上界。"
- id: powerplay
  title: "POWERPLAY: Training an Increasingly General Problem Solver by Continually Searching for the Simplest Still Unsolvable Problem"
  url: "https://arxiv.org/abs/1112.5309"
  link_label: arXiv
  date: 2011-12
  venue: arXiv
  authors: Schmidhuber
  category: foundations-theory
  tags: [open-endedness, curriculum, theory, forgetting]
  landmark: true
  summary: "Searches jointly over self-invented tasks and solver modifications, accepting a change only when a proof shows the new solver masters the novel task plus every earlier one, yielding an open-ended curriculum that cannot catastrophically forget."
  summary_zh: "在自我发明的任务与求解器修改的联合空间中搜索，只有当证明显示新求解器既能解决新任务又保留此前所有任务时才接受改动，从而得到不会灾难性遗忘的开放式课程。"
- id: simpleton-gambit
  title: Self-Modification and Mortality in Artificial Agents
  url: "https://link.springer.com/chapter/10.1007/978-3-642-22887-2_1"
  link_label: Paper
  date: 2011-08
  venue: AGI 2011
  authors: Orseau et al.
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code]
  summary: "Embeds a universal agent's own code inside its environment so it can rewrite itself, then confronts reinforcement-learning, goal-seeking, prediction-seeking, and knowledge-seeking variants with a Simpleton Gambit, showing all but the knowledge-seeker rationally self-modify into stupidity."
  summary_zh: "将通用智能体自身的代码嵌入环境使其可自我改写，再用“傻瓜赌局”考验强化学习型、目标寻求型、预测寻求型与知识寻求型四类智能体，显示除知识寻求型外都会理性地把自己改造成蠢货。"
- id: singularity-philosophical-analysis
  title: "The Singularity: A Philosophical Analysis"
  url: "https://consc.net/papers/singularity.pdf"
  link_label: Paper
  date: 2010-09
  venue: Journal of Consciousness Studies
  authors: Chalmers
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  landmark: true
  summary: "Reconstructs Good's intelligence explosion as an explicit premise-conclusion argument, then generalizes it away from intelligence into self-amplifying parameters plus tracking relations, classifying the possible failures as structural, correlation, or manifestation obstacles and arguing leakproof containment is unattainable."
  summary_zh: "把 Good 的智能爆炸重构为显式的前提—结论论证，再将其从“智能”抽象为自放大参数加追踪关系，把可能的失败归类为结构性、相关性与显现性障碍，并论证不可能实现完全密闭的封装。"
- id: models-of-technological-singularity
  title: An Overview of Models of Technological Singularity
  url: "https://agi-conf.org/2010/wp-content/uploads/2009/06/agi10singmodels2.pdf"
  link_label: Paper
  date: 2010-03
  venue: AGI-10 Workshop
  authors: Sandberg
  category: foundations-theory
  tags: [takeoff, taxonomy, theory, formal-analysis]
  summary: "Disentangles nine meanings of technological singularity into three aspects and surveys the corresponding formal growth models, showing that small increasing returns to efficiency generically yield exponential or faster growth once mental capital becomes copyable."
  summary_zh: "将\"技术奇点\"的九种含义梳理为三大类，并综述相应的形式化增长模型，表明一旦效率反馈带来哪怕微小的递增收益、且心智资本可被复制，指数级乃至更快的增长便普遍出现。"
- id: mahoney-rsi-model
  title: A Model for Recursively Self Improving Programs
  url: "https://mattmahoney.net/rsi.pdf"
  link_label: Paper
  date: 2008-09
  venue: Self-published draft
  authors: Mahoney
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code, takeoff]
  summary: "Formalizes recursive self-improvement as an infinite chain of self-rewriting programs, then proves the n-th iterate carries only O(log n) algorithmic complexity, arguing pure software self-modification adds neither knowledge nor compute and cannot yield strong self-improvement."
  summary_zh: "将递归自我改进形式化为无限的自改写程序序列，并证明第 n 代程序的算法复杂度仅为 O(log n)，据此论证纯软件层面的自我修改既不增加知识也不增加算力，无法带来强自我改进。"
- id: basic-ai-drives
  title: The Basic AI Drives
  url: "https://selfawaresystems.com/wp-content/uploads/2008/01/ai_drives_final.pdf"
  link_label: Paper
  date: 2008-01
  venue: AGI-08
  authors: Omohundro
  category: foundations-theory
  tags: [theory, self-modifying-code, reward-hacking, safety-evaluation]
  summary: "Derives from expected-utility reasoning that goal-driven systems of any architecture converge on instrumental drives — self-improvement, utility protection, resisting wireheading, self-preservation, resource acquisition — making recursive self-improvement a default behavior that containment alone will not prevent."
  summary_zh: "从期望效用推理出发论证：任何架构的目标驱动系统都会收敛到相同的工具性驱动——自我改进、保护效用函数、防止伪造效用（wireheading）、自我保存与资源获取——因而递归自我改进是默认行为，仅靠外部封闭难以阻止。"
- id: self-referential-optimal-rl
  title: Completely Self-referential Optimal Reinforcement Learners
  url: "https://link.springer.com/chapter/10.1007/11550907_36"
  link_label: Paper
  date: 2005-09
  venue: ICANN 2005
  authors: Schmidhuber
  category: foundations-theory
  tags: [theory, formal-analysis, self-modifying-code, reinforcement-learning]
  summary: "Specializes the Gödel machine to reinforcement learning: hardware, initial code, and utility are axioms, and the agent rewrites any part of itself only after proving the rewrite raises expected utility, provably eliminating constant-factor slowdowns."
  summary_zh: "将 Gödel machine 专门化到强化学习：硬件、初始代码与效用函数均编码为公理，智能体只有在证明某次改写能提升期望效用后才改写自身任意部分，并可证明地消除常数因子级的速度损失。"
- id: godel-machine
  title: "Goedel Machines: Self-Referential Universal Problem Solvers Making Provably Optimal Self-Improvements"
  url: "https://arxiv.org/abs/cs/0309048"
  link_label: arXiv
  date: 2003-09
  venue: arXiv
  authors: Schmidhuber
  category: foundations-theory
  tags: [theory, self-modifying-code, formal-analysis]
  landmark: true
  summary: "Defines a universal problem solver that rewrites any part of its own code, including its proof searcher, only after proving the rewrite beats continued proof search, yielding self-modifications that are globally optimal with no local maxima."
  summary_zh: "定义一种通用问题求解器：它可改写自身任意代码（包括证明搜索器），但必须先证明该改写优于继续搜索，从而使每次自我修改在给定公理下全局最优、不存在局部极值。"
- id: success-story-algorithm
  title: "Shifting Inductive Bias with Success-Story Algorithm, Adaptive Levin Search, and Incremental Self-Improvement"
  url: "https://doi.org/10.1023/A:1007383707642"
  link_label: Paper
  date: 1997-07
  venue: Machine Learning
  authors: Schmidhuber et al.
  category: foundations-theory
  tags: [self-modifying-code, reinforcement-learning, lifelong-learning, theory]
  summary: "Introduces self-modifying policies whose instructions rewrite the policy and its own learning algorithm, with the Success-Story Algorithm retaining a modification only when reward acceleration holds at every surviving checkpoint, enabling inductive transfer across task sequences."
  summary_zh: "提出自修改策略：策略中的指令可改写策略本身乃至其学习算法；Success-Story 算法仅当奖励加速在所有存活检查点上都成立时才保留该次自修改，否则回溯，从而实现跨任务序列的归纳迁移。"
- id: self-referential-weight-matrix-2
  title: "A 'Self-Referential' Weight Matrix"
  url: "https://link.springer.com/chapter/10.1007/978-1-4471-2063-6_107"
  link_label: Paper
  date: 1993-09
  venue: ICANN 1993
  authors: Schmidhuber
  category: foundations-theory
  tags: [self-modifying-code, weight-editing, theory]
  summary: "Dedicated input and output units let a recurrent network address, read, and modify any individual weight of its own matrix — including the weights doing the modifying — so it can learn and improve its own learning algorithm."
  summary_zh: "专用的输入与输出单元让循环网络能够寻址、读取并修改自身权重矩阵中的任意权重——包括负责修改的那些权重本身——从而学习并改进自己的学习算法。"
- id: technological-singularity
  title: "The Coming Technological Singularity: How to Survive in the Post-Human Era"
  url: "https://edoras.sdsu.edu/~vinge/misc/singularity.html"
  link_label: Paper
  date: 1993-03
  venue: VISION-21 Symposium
  authors: Vinge
  category: foundations-theory
  tags: [takeoff, theory, position-paper]
  summary: "Superhuman intelligence arriving via AI, networked minds, or human augmentation triggers a runaway in which each generation builds smarter successors faster, producing a Singularity beyond which human prediction fails and confinement or abstention is untenable."
  summary_zh: "由人工智能、网络化集体心智或人类增强带来的超人智能会触发失控循环——每一代都更快地造出更聪明的后继者——从而形成人类无法预测、既难以回避也难以围堵的奇点。"
- id: meta-evolution
  title: "Evolutionary principles in self-referential learning. (On learning how to learn: The meta-meta-... hook.)"
  url: "https://people.idsia.ch/~juergen/diploma.html"
  link_label: Paper
  date: 1987
  venue: "Diploma thesis, TU Munich"
  authors: Schmidhuber
  category: foundations-theory
  tags: [evolutionary-search, self-modifying-code, reinforcement-learning]
  summary: "Meta-Evolution applies genetic programming to itself so that the program-modifying programs are themselves evolved with no fixed meta-level ceiling, while PSALMs add a credit-conserving population of agents that inspect and rewrite their own code."
  summary_zh: "Meta-Evolution 将遗传编程施加于其自身，使修改程序的程序本身也被进化且不设元层级上限；PSALMs 则引入一个信用守恒的智能体群体，它们能够检视并改写自己的代码。"
- id: infinity-point
  title: "The time scale of artificial intelligence: Reflections on social effects"
  url: "https://raysolomonoff.com/publications/timesc.pdf"
  link_label: Paper
  date: 1985
  venue: Human Systems Management
  authors: Solomonoff
  category: foundations-theory
  tags: [takeoff, theory, formal-analysis]
  summary: "Coupled equations linking research-community size to falling compute cost formalize AI improving AI, driving capacity to infinity in finite time — 4.62 years at full reinvestment — an infinity point Solomonoff reads as model breakdown."
  summary_zh: "把研究共同体规模与不断下降的算力成本耦合起来的方程，形式化了 AI 改进 AI 的反馈：能力在有限时间内发散（全额再投资时约 4.62 年），Solomonoff 称之为无穷点，并视其为模型失效的信号。"
- id: ultraintelligent-machine
  title: Speculations Concerning the First Ultraintelligent Machine
  url: "https://doi.org/10.1016/S0065-2458(08)60418-0"
  link_label: Paper
  date: 1965
  venue: Advances in Computers
  authors: Good
  category: foundations-theory
  tags: [takeoff, theory, position-paper]
  landmark: true
  summary: "Since designing machines is itself an intellectual activity, an ultraintelligent machine would design still better ones, yielding an intelligence explosion — the last invention humanity need make, provided the first machine stays docile enough to remain controllable."
  summary_zh: "由于设计机器本身就是一项智力活动，超智能机器会设计出更强的机器，从而引发智能爆炸——这是人类需要做出的最后一项发明，前提是第一台机器足够温顺、仍可被控制。"

- id: agent-qa
  title: agent-qa
  url: https://vostride.com
  link_label: Project
  date: 2026-05
  venue: Software
  repo: vostride/agent-qa
  category: memory-experience-agents
  tags: [memory, experience-reuse, verifier]
  summary: "Curates verified QA-step evidence into persistent app facts, cautions, and procedures in memidex; subsequent runs retrieve this knowledge, while later outcomes update trust and CI runs only propose candidates."
  summary_zh: "将已验证的 QA 步骤证据提炼为 memidex 中持久保存的应用事实、注意事项和操作流程；后续运行检索这些知识，并根据新的结果更新信任度，CI 运行则只提出候选记录。"
