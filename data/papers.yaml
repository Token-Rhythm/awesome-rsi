- id: evolvenet
  title: "EvolveNet: Collaborative Harness Evolution for Agent Self-Improvement"
  url: "https://arxiv.org/abs/2608.04968"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Nie et al.
  category: self-modifying-agents
  tags: [self-modifying-code, coding-agents, multi-agent]
  summary: "Evolves a frozen-weight agent harness federatedly: K clients search program edits on their own workloads and return only deltas plus behavioral evidence, which a scope-typed aggregator composes and gates, lifting SWE-bench Verified 37.5 to 57.5%."
  summary_zh: "以联邦方式演化冻结权重智能体的 harness：K 个客户端在各自本地工作负载上搜索程序编辑，仅回传增量与行为证据，由按作用域分类的聚合器组合并把关，使 SWE-bench Verified 从 37.5% 提升到 57.5%。"
- id: gdpevo
  title: "GDPevo: Evaluating Agent Self-Evolution on Real Business Tasks"
  url: "https://arxiv.org/abs/2608.03764"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Zhou et al.
  repo: Prism-Shadow/GDPevo
  category: benchmarks-infrastructure
  tags: [benchmark, experience-reuse, skill-library]
  summary: "Benchmarks whether enterprise agents truly learn from experience by scattering atomic decision rules across training tasks and recombining them in held-out tests; the best self-evolution regime reaches 67% against a 91.6% informed-oracle ceiling."
  summary_zh: "通过将原子决策规则打散到训练任务、并在留出测试中重新组合，检验企业级智能体是否真正从经验中学习；最好的自演化设置只达到 67%，而知情 oracle 上限为 91.6%。"
- id: harness-r1
  title: "Harness-R1: Learning to Edit Executable Runtime Harnesses from Agent Failure Trajectories"
  url: "https://arxiv.org/abs/2608.02276"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Shao et al.
  repo: DeepExperience/Harness-R1
  category: self-modifying-agents
  tags: [self-modifying-code, meta-agent, reinforcement-learning]
  summary: "Trains a 9B harness engineer with GRPO to convert a frozen agent's failure trajectories into validated runtime patches, rewarded by measured before-and-after performance, lifting a Qwen3.5-9B target from 44.3% to 53.6% across three benchmarks."
  summary_zh: "用 GRPO 训练一个 9B 的 harness 工程师，把冻结智能体的失败轨迹转化为经验证的运行时补丁，并以补丁前后实测性能变化作为奖励，使 Qwen3.5-9B 目标智能体在三个基准上从 44.3% 提升到 53.6%。"
- id: past-bench
  title: "PAST-Bench: Benchmarking the Foundations of Recursive Self-Improvement in Personal Agents"
  url: "https://arxiv.org/abs/2608.04003"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Xue et al.
  repo: Gen-Verse/PAST-Bench
  category: benchmarks-infrastructure
  tags: [benchmark, memory, continual-learning]
  summary: "Isolates an agent's persistence layer with matched persistence-on versus persistence-off runs over 204 episodes, pairing the self-evolution gap with mechanism-evidence scores; gains span +0.13 to +0.24 and one framework regresses."
  summary_zh: "以持久化开/关的配对实验在 204 个 episode 上隔离智能体的持久化层，并将自演化增益与机制证据分数配对；增益区间为 +0.13 到 +0.24，其中一个框架反而退化。"
- id: romerl
  title: "RoMeRL: Balancing Feedback Coverage and the Memory-Reward Trap in Self-Evolving Agent Memory via Reduced-Order Utility States"
  url: "https://arxiv.org/abs/2608.02508"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Yang et al.
  repo: YOUNG-fnxm/RoMeRL
  category: memory-experience-agents
  tags: [memory, experience-reuse, reinforcement-learning]
  summary: "Replaces per-trajectory memory utilities with a fixed 2x2 per-task state factored by outcome polarity and memory dynamics, concentrating sparse feedback and escaping the memory-reward trap: 0.753 versus 0.724 average with an 84% smaller pool."
  summary_zh: "用按结果极性与记忆动态因子化的固定 2x2 任务级状态取代逐轨迹记忆效用，把稀疏反馈集中到有限支撑上并规避 memory-reward 陷阱：平均分 0.753 对 0.724，记忆池缩小 84%。"
- id: self-evolving-coding-agents-survey
  title: Self-Evolving Coding Agents
  url: "https://arxiv.org/abs/2608.03392"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Zhou et al.
  category: surveys-position
  tags: [survey, taxonomy, coding-agents]
  summary: "Surveys self-evolving coding agents with an object-centered taxonomy of what evolves, scaffold, memory, skills, model and workflow topology, cross-cut by evolution timing and evidence type, arguing executable feedback makes software engineering uniquely favorable yet overfitting-prone."
  summary_zh: "以对象为中心的分类法综述自进化编码智能体，区分脚手架、记忆、技能、模型与多智能体工作流拓扑五类进化对象，并辅以进化时机与证据类型两条维度，论证可执行反馈使软件工程格外有利却易过拟合。"
- id: spee
  title: Self-Improving Large Language Models via Progressive Experience Evolution
  url: "https://arxiv.org/abs/2608.02139"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Ren et al.
  repo: rrrsj/SPEE
  category: self-improving-training
  tags: [self-distillation, experience-reuse, reinforcement-learning]
  summary: "Distills successful and failed rollouts into a validated shared experience pool, internalizes it into weights via privileged on-policy self-distillation, then runs GRPO, lifting Qwen3-8B math accuracy from 32.2 to 38.7 with roughly 28% fewer trajectories."
  summary_zh: "将成功与失败的采样轨迹蒸馏为经效用校验的共享经验池，再通过特权 on-policy 自蒸馏把经验内化进权重并接续 GRPO，使 Qwen3-8B 数学准确率从 32.2 升至 38.7，训练轨迹减少约 28%。"
- id: skilljack
  title: "SkillJack: Persistent Skill Backdoors in Self-Evolving Agents"
  url: "https://arxiv.org/abs/2608.03509"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Ying et al.
  repo: Tencent/AI-Infra-Guard
  category: safety-governance
  tags: [skill-library, safety-evaluation, memory]
  summary: "Poisons the skill-extraction stage of self-evolving agents with benignly worded trajectories, so distillation launders policy violations into durable skill artifacts: LLM-judge detection drops from 98.5% to 11.4% and 80% of attacks survive record deletion."
  summary_zh: "通过注入措辞良性的投毒轨迹攻击自进化智能体的技能抽取阶段，使其蒸馏流程把违规行为洗白为持久的技能产物：LLM 评审检测率从 98.5% 降至 11.4%，且 80% 的攻击在原始记录被删除后仍然存续。"
- id: poisoned-evolution
  title: "When Experience Becomes Instruction: Trajectory Poisoning in Self-Evolving Agent Skill Systems"
  url: "https://arxiv.org/abs/2608.05563"
  link_label: arXiv
  date: 2026-08
  venue: arXiv
  authors: Chen et al.
  category: safety-governance
  tags: [skill-library, experience-reuse, safety-evaluation]
  summary: "Poisons self-evolving skill systems from an untrusted-user position by manipulating evidence attribution rather than injecting instructions, embedding malicious behavior into promoted skills in 91% of trials with only three records in a thirty-record pool."
  summary_zh: "以不可信用户的身份毒化自进化技能系统，靠操纵证据归因而非注入显式恶意指令，仅凭 30 条记录池中的 3 条记录，就在 91% 的试验中把恶意行为嵌入被提升的技能。"
- id: agentstream
  title: "AgentStream: How Well Do Self-Evolving LLM Agents Perform Under Streaming Tasks?"
  url: "https://arxiv.org/abs/2608.00155"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Yan et al.
  repo: Jasper-Yan/AgentStream
  category: benchmarks-infrastructure
  tags: [benchmark, memory, continual-learning]
  summary: "Streams tasks from six benchmarks through five self-evolution methods under isolated, sequential, and interleaved regimes, showing positive-gain rates drop from 75.7% to 62.3% once domains mix and strong models regress."
  summary_zh: "将六个基准的任务以隔离、顺序、交错三种模式流式送入五种自进化方法，显示跨领域混合后正收益率从 75.7% 降至 62.3%，且最强模型出现负向进化。"
- id: automem
  title: "AutoMem: Automated Learning of Memory as a Cognitive Skill"
  url: "https://arxiv.org/abs/2607.01224"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Wu et al.
  repo: autoLearnMem/AutoMem
  category: self-modifying-agents
  tags: [memory, self-modifying-code, meta-agent]
  summary: "Treats memory operations as first-class actions and runs two outer loops, a meta-LLM that rewrites the memory scaffold and LoRA training of a memory specialist, lifting Crafter progression from 25% to 51% for Qwen2.5-32B."
  summary_zh: "将记忆操作提升为一等公民动作，并通过两个外循环（元 LLM 重写记忆脚手架，以及对记忆专家模型做 LoRA 训练），把 Qwen2.5-32B 在 Crafter 上的进度从 25% 提升到 51%。"
- id: shadow-evaluations
  title: "Can AI agents conduct open-ended AI research? Early evidence from two case studies"
  url: "https://arxiv.org/abs/2607.27191"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Kirgis et al.
  category: limits-failure-modes
  tags: [scientific-discovery, taxonomy, benchmark]
  summary: "Grades agent-written papers on unpublished NeurIPS research questions using the original authors as reviewers, finding both Claude Opus 4.8 runs rejected at 2/6 and 1/6, and naming five recurring failure modes including ineffective backtracking and resource awareness."
  summary_zh: "让未发表 NeurIPS 论文的原作者按评审标准为智能体撰写的论文打分，发现两次 Claude Opus 4.8 运行分别只得 2/6 与 1/6，并归纳出包括回溯无力与资源利用不当在内的五类反复出现的失败模式。"
- id: darwinx
  title: "DarwinX: Evolving Agent Harnesses Through Natural Selection"
  url: "https://arxiv.org/abs/2608.07545"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Zhang et al.
  category: self-modifying-agents
  tags: [self-modifying-code, archive-search, evolutionary-search, coding-agents]
  landmark: true
  summary: "Evolves a population of agent harnesses under a preserve-and-extend contract in a tree archive scored by benchmark verifiers, lifting Terminal-Bench 2.1 from 75.5% to 83.2% with frozen models and transferring unchanged to SWE-bench Verified."
  summary_zh: "在树状存档中以“保留并扩展”契约演化智能体 harness 种群，由各基准自带验证器打分，在模型冻结的情况下把 Terminal-Bench 2.1 从 75.5% 提升到 83.2%，并可原样迁移到 SWE-bench Verified。"
- id: iterative-vibecoding-control
  title: Distributed Attacks in Persistent-State AI Control
  url: "https://arxiv.org/abs/2607.02514"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Hills et al.
  repo: josh-hills/control-arena-persistent-state-eval
  category: safety-governance
  tags: [control-protocol, safety-evaluation, coding-agents]
  summary: "Introduces Iterative VibeCoding, where an untrusted coding agent spreads a covert side task across successive pull requests, evading diff monitors 87% of the time; a stateful cross-PR monitor cuts evasion to 54%."
  summary_zh: "提出 Iterative VibeCoding 设定：不可信编码智能体把隐蔽副任务分散到连续多个 pull request 中，87% 的情况下绕过 diff 监控；带跨 PR 持久笔记的有状态监控将逃逸率降到 54%。"
- id: evoagentbench
  title: "EvoAgentBench: Benchmarking Agent Self-Evolution via Ability Transfer"
  url: "https://arxiv.org/abs/2607.05202"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Gao et al.
  repo: EverMind-AI/EvoAgentBench
  category: benchmarks-infrastructure
  tags: [benchmark, experience-reuse, skill-library, memory]
  summary: "Isolates procedural ability transfer in self-evolving agents by extracting trace-grounded Ability cards into per-domain Ability Graphs, guaranteeing every test task has verified training-side support; curated skills help everywhere while Memento, ReasoningBank, and GEPA show negative transfer."
  summary_zh: "通过从执行轨迹中抽取 Ability card 并构建按领域划分的 Ability Graph，保证每个测试任务都有经过验证的训练侧支撑，从而隔离出自进化智能体的过程性能力迁移；人工整理的技能在所有设置下都提升，而 Memento、ReasoningBank 和 GEPA 出现负迁移。"
- id: evopolicygym
  title: "EvoPolicyGym: Evaluating Autonomous Policy Evolution in Interactive Environments"
  url: "https://arxiv.org/abs/2607.02440"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Wang et al.
  repo: Linzwcs/EvoPolicyGym
  category: benchmarks-infrastructure
  tags: [benchmark, self-modifying-code, reinforcement-learning]
  summary: "Benchmarks autonomous policy evolution by having harness agents repeatedly rewrite executable Python control policies under a fixed 128-episode budget across 16 interactive environments with held-out cases hidden; GPT-5.5 leads at 0.891 rank score."
  summary_zh: "通过让 harness 智能体在固定 128 回合预算下反复重写可执行的 Python 控制策略、并隐藏留出用例，在 16 个交互式环境上评测自主策略演化；GPT-5.5 以 0.891 的排名分领先。"
- id: evosop
  title: "From Atomic Actions to Standard Operating Procedures: Iterative Tool Optimization for Self-Evolving LLM Agents"
  url: "https://arxiv.org/abs/2607.07321"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Ding et al.
  category: self-modifying-agents
  tags: [tool-synthesis, skill-library, experience-reuse]
  summary: "Mines recurring atomic-action segments from agent trajectories into executable Standard Operating Procedure tools, then merges, re-executes, and prunes them by measured utility, gaining up to 13.4 points on ACEBench Multi-Step without touching model weights."
  summary_zh: "从智能体轨迹中挖掘反复出现的原子动作片段并改写为可执行的标准作业流程（SOP）工具，再对其合并、重执行并按实测效用剪枝，在 ACEBench Multi-Step 上最高提升 13.4 个百分点，且无需更新模型权重。"
- id: frontis-ma1
  title: "Frontis-MA1: Training an AI4AI Model towards Recursive Self-Improvement in Machine Learning Engineering"
  url: "https://arxiv.org/abs/2607.28568"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Yang et al.
  repo: FrontisAI/OpenRSI
  category: automated-ai-research
  tags: [evolutionary-search, coding-agents, reinforcement-learning]
  summary: "Post-trains a 35B agent around four program-evolution operators (Draft, Improve, Debug, Crossover) with execution-grounded SFT plus RL, then couples it to evolutionary search, raising MLE-Bench Lite medal average from 39.4% to 71.2%."
  summary_zh: "围绕 Draft、Improve、Debug、Crossover 四个程序进化算子，以执行验证的 SFT 加 RL 后训练一个 35B 智能体并接入进化搜索，将 MLE-Bench Lite 夺牌率从 39.4% 提升到 71.2%。"
- id: ideagent
  title: "IDEAgent: Agentic Quality-Diversity Search for Research Idea Generation"
  url: "https://arxiv.org/abs/2607.22375"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Gumma et al.
  repo: declare-lab/IDEAgent
  category: automated-ai-research
  tags: [quality-diversity, evolutionary-search, scientific-discovery, multi-agent]
  summary: "Evolves research ideas as a quality-diversity search with lineage archives, specialized judge agents, and one-shot repair or refinement of near-miss ideas, scoring 3.89x the best baseline on a maximum-clique Yield metric of mutually distinct ideas."
  summary_zh: "以质量-多样性搜索的方式演化研究想法，借助谱系存档、专门的评判智能体以及对接近阈值想法的一次性修复或精炼，在以最大团计算的 Yield 指标上达到最佳基线的 3.89 倍。"
- id: manta
  title: "MANTA: Multi-Agent Network Topology Adaptation for Self-Evolving Multi-Agent Systems"
  url: "https://arxiv.org/abs/2607.28527"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Huang et al.
  category: multi-agent-evolution
  tags: [multi-agent, agent-topology, memory]
  summary: "Selects a task-conditioned communication topology from a learned playbook, audits execution traces against an eleven-category anomaly taxonomy, and applies at most one bounded topology mutation per run, averaging 74.0 across five benchmarks versus 68.2 for ADAS."
  summary_zh: "根据任务从习得的 playbook 中选择通信拓扑，用十一类过程异常分类法审计执行轨迹，并对被标记的运行至多施加一次有界拓扑变异，在五个基准上平均达 74.0，高于 ADAS 的 68.2。"
- id: metaskill-evolve
  title: "MetaSkill-Evolve: Recursive Self-Improvement of LLM Agents via Two-Timescale Meta-Skill Evolution"
  url: "https://arxiv.org/abs/2607.05297"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Wang et al.
  category: self-modifying-agents
  tags: [meta-agent, skill-library, evolutionary-search]
  summary: "Two-timescale search evolves both an agent's task skills and the five-stage meta-skill pipeline that produces them, lifting held-out OfficeQA accuracy 23.5 points on a frozen backbone."
  summary_zh: "通过双时间尺度搜索同时进化智能体的任务技能与生成这些技能的五阶段元技能流水线，在冻结骨干模型上将 OfficeQA 留出集准确率提升 23.5 个百分点。"
- id: self-play-judge-reward-hacking
  title: "More Convincing, Not More Correct: Self-Play Reward Hacking of Reference-Free LLM Judges"
  url: "https://arxiv.org/abs/2607.05904"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Zhou
  category: limits-failure-modes
  tags: [reward-hacking, self-rewarding, self-play, verifier]
  summary: "Shows reference-free LLM judges score plausibility rather than correctness, so DPO self-play lifts judge pass rate to 0.94 while true accuracy stays flat; forcing the judge to answer first collapses false positives."
  summary_zh: "表明无参考的 LLM 裁判评的是看起来是否合理而非正确性，因此 DPO 自我博弈把裁判通过率抬到 0.94 而真实准确率原地不动；要求裁判先自行作答再评分则使假阳性率崩塌。"
- id: areal-2-0
  title: Next-Generation Agentic Reinforcement Learning Systems Enable Self-Evolving Agents
  url: "https://arxiv.org/abs/2607.01120"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Yan et al.
  repo: areal-project/AReaL
  category: surveys-position
  tags: [position-paper, reinforcement-learning, infrastructure, continual-learning]
  summary: "Argues that enterprise self-evolving agents are bottlenecked by online-RL infrastructure rather than algorithms, proposing a step-level trajectory protocol, a governed production-data proxy, and an evolution control plane, instantiated as AReaL2.0, a drop-in inference backend capturing trajectories."
  summary_zh: "提出企业级自进化智能体的瓶颈在于智能体在线 RL 基础设施而非算法，主张三大缺失支柱——步级智能体轨迹数据协议、受治理的生产数据代理与统一的进化控制平面，并以可直接替换推理后端、边服务边采集轨迹的 AReaL2.0 加以实现。"
- id: attt
  title: "No Time Like the Present: Agentic Test-Time Training for LLM Agents"
  url: "https://arxiv.org/abs/2607.03441"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Wang et al.
  category: self-improving-training
  tags: [test-time-training, weight-editing, continual-learning, coding-agents]
  summary: "Down-weights tokens whose n-grams already appeared in earlier updates, keeping in-episode LoRA test-time training from reinforcing repeated states and failed actions, and adds up to +5.0 points on ALFWorld and +4.9 on SWE-bench Lite at 1.9x cost."
  summary_zh: "对 n-gram 已在此前更新中出现过的 token 降权，使单个 episode 内的 LoRA 测试时训练不再强化重复状态与失败动作，在 1.9 倍开销下于 ALFWorld 最多提升 5.0 分、SWE-bench Lite 提升 4.9 分。"
- id: rsi-bounded-to-autonomous-survey
  title: "Recursive Self-Improvement in AI: From Bounded Self-Refinement to Autonomous Research Loops"
  url: "https://arxiv.org/abs/2607.07663"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Chen et al.
  category: surveys-position
  tags: [survey, taxonomy, verifier, model-collapse]
  summary: "Maps 1,250 papers by what improves and how closed the loop is, ranking self-evaluation signals from formal verifiers down to intrinsic confidence and separating bounded self-refinement from still-rare open-ended recursive self-improvement."
  summary_zh: "按“改进什么”与“闭环程度”两个维度梳理 1,250 篇论文，把自评估信号从形式化验证器一路排到内在置信度，并区分有界自我精炼与仍然稀少的开放式递归自我改进。"
- id: harness-evolution-evaluation
  title: Rethinking the Evaluation of Harness Evolution for Agents
  url: "https://arxiv.org/abs/2607.12227"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Wang et al.
  repo: rethinking-harness-evolution/code
  category: limits-failure-modes
  tags: [meta-agent, self-modifying-code, benchmark]
  summary: "Attributes reported harness-evolution gains to protocol flaws, namely searching and evaluating on the same benchmark without budget-matched baselines, showing evolved harnesses trail plain parallel sampling and transfer only 0.6 points to held-out tasks."
  summary_zh: "将已报告的 harness 演化收益归因于评测协议缺陷——搜索与最终评估复用同一基准、且缺少预算对齐的基线——并显示演化后的 harness 不敌简单并行采样，迁移到留出任务平均仅提升 0.6 分。"
- id: rsibench-data
  title: "RSIBench-Data: Benchmarking Data-Centric Research for Recursive Self-Improvement"
  url: "https://arxiv.org/abs/2607.25886"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Meng et al.
  repo: evolvent-ai/RSIBench-Data
  category: benchmarks-infrastructure
  tags: [benchmark, synthetic-data, coding-agents]
  summary: "Freezes model, trainer, and budget so a research agent's only lever is proposing training-data recipes, revealing a discovery-reliability gap where 78% of continued searches end below their own peak score."
  summary_zh: "冻结模型、训练器与预算，使研究智能体唯一的操作空间是提出训练数据配方，揭示出发现与可靠性之间的落差：78% 继续搜索的运行最终低于自身峰值分数。"
- id: seal-exogenous-acceptance-loop
  title: Self-Authored Verification Is Unreliable in Heuristic Self-Improving Agents
  url: "https://arxiv.org/abs/2607.24300"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Guo et al.
  category: limits-failure-modes
  tags: [reward-hacking, verifier, self-modifying-code]
  summary: "Documents a verifier-deployment gap where agents that write their own acceptance tests report success while underperforming random play, and gates each self-proposed edit behind a hidden audit harness returning one accept/reject bit."
  summary_zh: "揭示验证—部署鸿沟：自行编写验收测试的智能体一边报告成功、一边表现低于随机策略；SEAL 让每次自我提议的修改都必须通过一个对智能体不可见的审计环境，且只返回一位接受/拒绝信号。"
- id: self-improving-agents-survey
  title: "Self-Improvements in Modern Agentic Systems: A Survey"
  url: "https://arxiv.org/abs/2607.13104"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Ren et al.
  category: surveys-position
  tags: [survey, taxonomy, prompt-optimization, memory]
  summary: "Formalizes an agent as model parameters plus an operational scaffold and splits self-improvement into slow weight updates versus fast reversible scaffold updates across prompts, memory, tools, and control logic, then surveys six application domains."
  summary_zh: "将智能体形式化为模型参数加运行脚手架，把自我改进划分为缓慢的权重更新与快速可逆的脚手架更新（涵盖提示、记忆、工具与控制逻辑），并综述六个应用领域。"
- id: sesa
  title: "Self-Play Meets Skill Evolution: Self-Evolving Search Agents that Pose, Solve, and Remember"
  url: "https://arxiv.org/abs/2607.29468"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Fu et al.
  repo: Zenghuang-Fu/SESA-Self-Evolving-Search-Agents
  category: self-play-zero-data
  tags: [self-play, proposer-solver, skill-library, search-agents]
  summary: "Pairs an asymmetric challenger that poses retrieval questions tuned to about 50% solver success with a GRPO-trained solver and a bank of skills distilled from failed rollouts, beating the SSP self-play baseline by 1.2-3.2 points."
  summary_zh: "让不对称 challenger 生成使 solver 成功率约 50% 的检索问题，配合 GRPO 训练的 solver 以及由失败轨迹蒸馏出的技能库，比 SSP 自博弈基线高出 1.2-3.2 分。"
- id: introspection-threshold
  title: "Self-Reference in Large Language Models: The Introspection Threshold for Recursive Self-Improvement"
  url: "https://arxiv.org/abs/2607.04277"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Zhang et al.
  category: foundations-theory
  tags: [theory, formal-analysis, takeoff]
  summary: "Adapts von Neumann's complexity threshold to recursive self-improvement, arguing that sustained gains require an introspection threshold where self-modeling, self-simulation, self-evaluation and self-modification cohere, and finds current LLMs blocked at quasi-introspection."
  summary_zh: "借鉴冯·诺依曼关于自复制自动机的复杂度阈值，论证持续的递归自我改进需要跨越一个内省阈值——自我建模、自我模拟、自我评估与自我修改在此协同——并发现当前 LLM 仍受阻于准内省阶段。"
- id: skill-self-play
  title: "Skill Self-Play: Pushing the Frontier of LLM Capability with Co-Evolving Skills"
  url: "https://arxiv.org/abs/2607.22529"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Huang et al.
  repo: Qwen-Applications/skill-self-play
  category: self-play-zero-data
  tags: [self-play, proposer-solver, skill-library, verifier]
  summary: "Makes skills the unit of self-play: a proposer generates tasks from an evolving skill library with executable validators while GRPO trains the solver, gaining 12 points on ZebraLogic for Qwen3-4B."
  summary_zh: "以技能作为自博弈的基本单元：提议者依据不断进化、带可执行验证器的技能库生成任务，并用 GRPO 训练求解者，使 Qwen3-4B 在 ZebraLogic 上提升 12 个百分点。"
- id: skillcoach
  title: "SkillCoach: Self-Evolving Rubrics for Evaluating and Enhancing Agentic Skill-Use"
  url: "https://arxiv.org/abs/2607.01874"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Zhu et al.
  category: benchmarks-infrastructure
  tags: [benchmark, verifier, process-reward, skill-library]
  summary: "Evolves trajectory-level rubrics over four skill-use axes through a rollout, judge, and arbitration loop with validation-gated patches, raising agreement with human trajectory labels from 82% to 96% and lifting rubric-filtered SFT from 18% to 32%."
  summary_zh: "通过 rollout、LLM 评判与仲裁循环，并以验证门控方式接受局部补丁，自演化出覆盖四个技能使用维度的轨迹级评分标准，使与人工轨迹标注的一致率从 82% 升至 96%，并将据其筛选的 SFT 从 18% 提升到 32%。"
- id: double-ratchet
  title: "Who Grades the Grader? Co-Evolving Evaluation Metrics and Skills for Self-Improving LLM Agents"
  url: "https://arxiv.org/abs/2607.12790"
  link_label: arXiv
  date: 2026-07
  venue: arXiv
  authors: Zhang et al.
  repo: amazon-science/Self-Evolving-Agents-Double-Ratchet
  category: self-modifying-agents
  tags: [verifier, evolutionary-search, skill-library, reward-hacking]
  summary: "Evolves the grader itself, searching compositions of drawback detectors scored against a ten-item anchor set, so skill evolution runs without ground truth and retains 88-110% of supervised gains; ablation shows task score cannot validate a self-evolved evaluator."
  summary_zh: "把评测指标本身作为进化对象：搜索由缺陷检测器组合而成的度量，并以十条锚定样本的一致性打分，使技能进化无需真值监督即可保留 88-110% 的监督增益；消融实验表明任务分数无法验证自进化评测器的有效性。"
- id: adamem
  title: "AdaMEM: Test-Time Adaptive Memory for Language Agents"
  url: "https://arxiv.org/abs/2606.05684"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Zhang et al.
  repo: yunx-z/AdaMEM
  category: memory-experience-agents
  tags: [memory, experience-reuse, test-time-training]
  summary: "AdaMEM pairs an offline trajectory memory with a short-term strategy the agent regenerates mid-episode on its own refresh decision, plus step-level rejection-sampling SFT, lifting ALFWorld unseen to 58.2% and scaling monotonically with retrieval budget."
  summary_zh: "AdaMEM 将离线轨迹记忆与由智能体自行决定何时刷新的短期策略记忆相结合，并加入步级拒绝采样 SFT，把 ALFWorld unseen 提升到 58.2%，且性能随检索预算单调提升。"
- id: agent-skill-evolution-survey
  title: "Agent Skill Evaluation and Evolution: Frameworks and Benchmarks"
  url: "https://arxiv.org/abs/2606.11435"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Ding et al.
  category: surveys-position
  tags: [survey, skill-library, benchmark, taxonomy]
  summary: "Organizes automated agent-skill evolution into four paradigms by feedback signal — execution feedback, trajectory distillation, library compression, and reinforcement learning — and surveys six benchmark families, noting none measures skill evolution longitudinally across rounds."
  summary_zh: "按反馈信号将自动化 agent 技能演化归纳为执行反馈、轨迹蒸馏、技能库压缩与强化学习四种范式，并综述六类基准，指出目前没有基准能纵向衡量多轮反馈下的技能演化。"
- id: bit-equivalent-open-endedness
  title: An Information-Theoretic Definition for Open-Ended Learning
  url: "https://arxiv.org/abs/2606.08369"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Xu et al.
  category: foundations-theory
  tags: [theory, open-endedness, formal-analysis]
  summary: "Defines open-endedness as linear growth in 'bit-equivalent', the minimum reward-relevant information an agent must acquire, proves standard bandit families fall short, and constructs an insatiable bandit where truncated Thompson sampling provably attains the optimal linear rate."
  summary_zh: "把开放式学习定义为 'bit-equivalent'（智能体必须获取的最少与奖励相关信息）的线性增长，证明标准 bandit 族达不到该标准，并构造出一个 insatiable bandit，其中截断 Thompson 采样可证明达到最优线性速率。"
- id: apex-prompt-optimizer
  title: "APEX: Automated Prompt Engineering eXpert with Dynamic Data Selection"
  url: "https://arxiv.org/abs/2606.11459"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Wang et al.
  category: context-prompt-workflow
  tags: [prompt-optimization, curriculum, context-engineering]
  summary: "Stratifies the dev set by recent pass/fail history so prompt mutation targets recoverable failures and selection spends its budget on rank-discriminative examples, lifting Gemini 2.5 Flash 11.2 points under a fixed 5,000-call budget versus GEPA's 5.2."
  summary_zh: "按近期通过/失败历史对开发集分层，使 prompt 变异聚焦于可修复的错误、候选筛选把预算花在能区分排名的样本上，在固定 5,000 次评测调用预算下让 Gemini 2.5 Flash 提升 11.2 分，而 GEPA 仅 5.2 分。"
- id: attack-selection-control-evals
  title: Attack Selection in Agentic AI Control Evaluations Meaningfully Decreases Safety
  url: "https://arxiv.org/abs/2606.06529"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Ge-Wang et al.
  category: safety-governance
  tags: [control-protocol, safety-evaluation, scheming]
  summary: "Letting an untrusted attacker choose when to strike — scoring each task pair before starting and aborting mid-trajectory when detection risk rises — cuts measured safety by 20-28 points without raising attack success rates."
  summary_zh: "让不可信攻击者自行选择出手时机——开始前为每对任务打分、并在被察觉风险升高时中途放弃——使控制评估中测得的安全性下降 20 至 28 个百分点，而攻击成功率并未上升。"
- id: experiential-latent-memories
  title: Continual Self-Improvement with Lightweight Experiential Latent Memories
  url: "https://arxiv.org/abs/2606.17803"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Dorovatas et al.
  category: self-improving-training
  tags: [test-time-training, memory, self-rewarding, continual-learning]
  summary: "Crystallizes inference-time computation into ~20-token soft-prompt memories trained by GRPO against a majority-vote self-reward and retrieved per problem, lifting frozen Llama-3.1-8B from 45% to 51.4% on MATH500 without dataset access."
  summary_zh: "将推理时计算固化为约 20 个 token 的软提示记忆，用多数投票自奖励经 GRPO 训练并按题检索，在无需预先访问数据集的情况下把冻结的 Llama-3.1-8B 在 MATH500 上从 45% 提升到 51.4%。"
- id: curator
  title: "Forget to Improve: On-Device LLM-Agent Continual Learning via Budget-Curated Memory"
  url: "https://arxiv.org/abs/2606.25115"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Wu et al.
  category: memory-experience-agents
  tags: [memory, experience-reuse, continual-learning, forgetting]
  summary: "Scores each memory entry by net value per byte to drive eviction, peer sharing, and provenance-gated admission, so on-device agents improve from curated experience alone: 0.605 vs 0.528 accuracy at 2.7x less memory."
  summary_zh: "以每字节净价值这一单一评分驱动记忆条目的淘汰、对等共享与来源门控准入，使端侧智能体仅靠精选经验即可提升：准确率 0.605 对 0.528，峰值内存降低 2.7 倍。"
- id: agent-harness-survey
  title: "From Question Answering to Task Completion: A Survey on Agent System and Harness Design"
  url: "https://arxiv.org/abs/2606.20683"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Guo et al.
  category: surveys-position
  tags: [survey, taxonomy, context-engineering, co-evolution]
  summary: "Surveys roughly 260 works through a model-harness lens, formalizing the agent harness as a six-tuple and tracing four paradigms from prompt engineering to agent-native training where model, harness, and improvement mechanism co-evolve from deployment traces."
  summary_zh: "以「模型-harness」视角综述约 260 篇工作，将 agent harness 形式化为六元组，并梳理从提示工程到 agent 原生训练的四个范式，最终模型、harness 与改进机制依据部署轨迹共同演化。"
- id: heuresis
  title: "Heuresis: Search Strategies for Autonomous AI Research Agents Across Quality, Diversity and Novelty"
  url: "https://arxiv.org/abs/2606.25198"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Antoniades et al.
  repo: a-antoniades/Heuresis
  category: automated-ai-research
  tags: [algorithm-discovery, quality-diversity, archive-search, reward-hacking]
  summary: "Heuresis decomposes the autonomous research loop into swappable primitives and benchmarks six quality-diversity search strategies over 3,222 real GPU runs, finding that strategies shift where ideas land but never rate a single idea as original."
  summary_zh: "Heuresis 将自主科研循环拆解为可替换的组件，并在 3,222 次真实 GPU 实验上对比六种质量-多样性搜索策略，发现这些策略只改变想法的落点，却没有一个想法被评为原创。"
- id: llm-sleep
  title: "Language Models Need Sleep: Learning to Self-Modify and Consolidate Memories"
  url: "https://arxiv.org/abs/2606.03979"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Behrouz et al.
  category: self-improving-training
  tags: [self-distillation, synthetic-data, weight-editing, continual-learning]
  summary: "Splits an LLM's lifecycle into active and sleep phases, where sleep grows new low-rank MoE experts, distills fast-memory knowledge into them, and reinforces self-generated dreams, beating SEAL on knowledge incorporation (48.9% vs 46.7%) and few-shot ARC."
  summary_zh: "将 LLM 的生命周期切分为活跃期与睡眠期，睡眠期新增低秩 MoE 专家、把快速记忆模块的知识蒸馏进去并强化自生成的“梦境”数据，在知识吸收上以 48.9% 对 46.7% 超过 SEAL，并在 few-shot ARC 上领先。"
- id: maa
  title: Marginal Advantage Accumulation for Memory-Driven Agent Self-Evolution
  url: "https://arxiv.org/abs/2606.20475"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Yang et al.
  category: memory-experience-agents
  tags: [memory, experience-reuse, credit-assignment]
  summary: "Accumulates signed, side-by-side advantage estimates for each memory operation across batches via bias-corrected EMA, separating stably useful edits from lucky ones; as a drop-in layer it wins 14 of 16 settings while cutting optimization tokens roughly 75%."
  summary_zh: "以偏差校正的 EMA 跨批次累积每个记忆操作的带符号对照优势信号，把稳定有益的编辑与偶然侥幸的编辑区分开；作为即插即用的后处理层在 16 个基准-模型设置中赢下 14 个，同时将优化阶段 token 消耗削减约 75%。"
- id: mas-promptbench
  title: "MAS-PromptBench: When Does Prompt Optimization Improve Multi-Agent LLM Systems?"
  url: "https://arxiv.org/abs/2606.23664"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Bai et al.
  repo: juyangbai/MAS-PromptBench
  category: benchmarks-infrastructure
  tags: [benchmark, prompt-optimization, multi-agent, agent-topology]
  summary: "Factorially varies tasks, topologies, protocols and team sizes to test whether prompt optimization transfers to multi-agent systems, finding gains shrink from +4.2 points single-agent to +0.5-2.3 multi-agent and turn negative (-2.1) at ten agents."
  summary_zh: "通过对任务、拓扑、通信协议与团队规模做析因变化，检验 prompt 优化能否迁移到多智能体系统，发现增益从单智能体的 +4.2 分收缩到多智能体的 +0.5 至 +2.3 分，并在十个智能体时转为负值（-2.1）。"
- id: lucid
  title: Memory Reward Inflation in Self-Improving LLM Agents
  url: "https://arxiv.org/abs/2608.00017"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Asadolahi et al.
  category: limits-failure-modes
  tags: [memory, reward-hacking, self-rewarding, verifier]
  summary: "Formalizes the Echo Gap, where self-graded memory agents inflate scores of wrong episodes and preferentially re-retrieve them, and counters it with LUCID, label-free demotion from answer-free evidence, raising BIRD text-to-SQL accuracy from 54.0% to 56.9%."
  summary_zh: "形式化了“回声鸿沟”：自评记忆的智能体会系统性高估错误经验的分数并优先反复检索它们；并提出 LUCID，用无标签的答案无关证据下调分数，将 BIRD text-to-SQL 准确率从 54.0% 提升到 56.9%。"
- id: mlevolve
  title: "MLEvolve: A Self-Evolving Framework for Automated Machine Learning Algorithm Discovery"
  url: "https://arxiv.org/abs/2606.06473"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Du et al.
  repo: InternScience/MLEvolve
  category: automated-ai-research
  tags: [algorithm-discovery, memory, experience-reuse, multi-agent]
  summary: "Replaces MCTS with a graph search whose reference edges let branches borrow and merge solutions, paired with retrospective memory of past plans and outcomes, reaching a 65.3% MLE-Bench medal rate in half the usual runtime."
  summary_zh: "用带引用边的图搜索取代 MCTS，使各分支可相互借鉴与合并方案，并配合记录既往方案与结果的回溯式记忆，在 MLE-Bench 上以一半运行时间取得 65.3% 的获奖率。"
- id: pace-acceptance-tests
  title: "PACE: Anytime-Valid Acceptance Tests for Self-Evolving Agents"
  url: "https://arxiv.org/abs/2606.08106"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: ZayxShawn
  category: foundations-theory
  tags: [formal-analysis, verifier, self-modifying-code, prompt-optimization]
  summary: "Gates self-evolving agents' commits with a training-free sequential betting test whose martingale bound caps per-candidate false-acceptance at alpha, cutting greedy acceptance's 13-21 spurious prompt edits per run to roughly zero while using fewer dev evaluations."
  summary_zh: "用免训练的序列下注检验为自演化智能体的提交把关，其鞅界将单候选误接受概率控制在 alpha 以内，把贪心接受每轮 13-21 次的虚假 prompt 自修改降至几乎为零，同时减少开发集评测开销。"
- id: deployed-rl-should-be-continual
  title: "Position: Deployed Reinforcement Learning should be Continual"
  url: "https://arxiv.org/abs/2606.04029"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Behdin et al.
  category: surveys-position
  tags: [position-paper, continual-learning, reinforcement-learning]
  summary: "Argues that any deployed agent smaller than its environment yet receiving reward is inherently a continual-RL problem, identifying four post-deployment sources of non-stationarity and rebutting five counterarguments with evidence from Cursor Tab and Lyft."
  summary_zh: "论证任何容量小于所处环境却仍能获得奖励信号的已部署智能体本质上都是持续 RL 问题，梳理部署后才出现的四类非平稳性来源，并用 Cursor Tab 与 Lyft 的证据反驳五种反对意见。"
- id: rsea
  title: Recursive Self-Evolving Agents via Held-Out Selection
  url: "https://arxiv.org/abs/2606.28374"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Nguyen et al.
  category: context-prompt-workflow
  tags: [context-engineering, skill-library, experience-reuse, self-correction]
  summary: "Evolves a frozen agent's strategy preamble, skill rules, and playbook from verified rollouts, advancing only on strict held-out improvement so it provably degenerates to ReAct rather than regressing; ALFWorld rises to 69.3% while larger-model transfer stays tied."
  summary_zh: "在冻结权重下，从已验证的成功与失败轨迹中改写策略前言、可复用技能规则与操作手册三层自然语言状态，仅在留出集严格提升时才推进，因而最差退化为普通 ReAct 而不会倒退；ALFWorld 达到 69.3%，更大模型上的迁移则与基线持平。"
- id: experience-internalization
  title: Rethinking Continual Experience Internalization for Self-Evolving LLM Agents
  url: "https://arxiv.org/abs/2606.04703"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Chen et al.
  repo: RUCBM/ExpInternalization
  category: limits-failure-modes
  tags: [capability-erosion, experience-reuse, self-distillation, continual-learning]
  summary: "Controlled study of converting agent experience into weights across self-evolution rounds reveals progressive capability collapse, and shows principle-level, step-wise, off-policy distillation avoids it, sustaining gains over three iterations where global injection decays to 12.8%."
  summary_zh: "对将 agent 经验内化进权重的多轮自进化做受控研究，揭示了渐进式能力坍塌，并表明原则级、分步注入的离策略蒸馏可以避免它，使三轮迭代持续提升，而全局注入退化至 12.8%。"
- id: role-agent
  title: "Role-Agent: Bootstrapping LLM Agents via Dual-Role Evolution"
  url: "https://arxiv.org/abs/2606.10917"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Wang et al.
  repo: AMAP-ML/roleagent
  category: self-improving-training
  tags: [process-reward, world-models, curriculum, reinforcement-learning]
  summary: "Role-Agent has a single LLM serve as both policy and environment model, turning next-state prediction accuracy into a multiplicative process reward and self-diagnosed failure modes into a retrained curriculum, beating GiGPO by over 4% on average."
  summary_zh: "Role-Agent 让单个 LLM 同时充当策略与环境模型，把下一状态预测的准确度转化为乘性过程奖励，并将自诊断的失败模式转化为再训练课程，平均超过 GiGPO 4% 以上。"
- id: mlas-self-evolving-safety
  title: "Safety in Self-Evolving LLM Agent Systems: Threats, Amplification, and Case Studies"
  url: "https://arxiv.org/abs/2606.23075"
  link_label: arXiv
  date: 2026-06
  venue: arXiv
  authors: Lin et al.
  category: safety-governance
  tags: [safety-evaluation, taxonomy, self-modifying-code]
